    for (let k = st.level + 1; k <= cap; k++) out.push(k);
    return out;
  }
  const discounted = (S, i, cost) => Math.max(0, Math.round(cost * (1 - (PL(S, i).discount || 0))));
  function buyCost(S, i, ti, level) { return discounted(S, i, TILES[ti].type === 'spot' ? TILES[ti].price : costRange(ti, -1, level)); }
  function upgradeCost(S, i, ti, level) { return discounted(S, i, costRange(ti, S.tiles[ti].level, level)); }

  // ---------- tol ----------
  function rentInfo(S, ti) {
    const t = TILES[ti], st = S.tiles[ti], o = st.owner;
    if (o < 0) return null;
    const parts = [];
    let r;
    if (t.type === 'spot') {
      const n = spotsOf(S, o).length;
      r = RULES.spotRent[Math.max(0, n - 1)];
      parts.push({ k: 'base', label: 'Tol wisata (' + n + ' dimiliki)', v: r });
    } else {
      r = t.price * RULES.rentMult[st.level];
      parts.push({ k: 'base', label: 'Tol ' + LEVEL_NAME[st.level], v: Math.round(r) });
      if (ownsGroup(S, o, t.group)) { r *= RULES.groupMult; parts.push({ k: 'group', label: 'Grup ' + GROUPS[t.group].name + ' penuh', m: RULES.groupMult }); }
      if (S.festival.tile === ti) { r *= S.festival.mult; parts.push({ k: 'fest', label: 'Festival Cinta', m: S.festival.mult }); }
    }
    const pct = tierInfo(PL(S, o).love).rentPct;
    if (pct) { r *= 1 + pct / 100; parts.push({ k: 'love', label: 'Love Meter ' + tierInfo(PL(S, o).love).name, pct }); }
    return { amount: r5(r), parts };
  }
  function rentFor(S, ti, payer) {
    const st = S.tiles[ti];
    if (st.owner < 0 || st.owner === payer || (payer >= 0 && PL(S, st.owner).bankrupt)) return 0;
    const ri = rentInfo(S, ti);
    return ri ? ri.amount : 0;
  }

  // ---------- menang instan & ambil alih ----------
  function winCheck(S, i) {
    const p = PL(S, i);
    if (!p || p.bankrupt) return null;
    const fg = fullGroups(S, i);
    if (fg.length >= RULES.tripleGroups) return { kind: 'triple', groups: fg.slice(0, RULES.tripleGroups) };
    for (const sd of SIDE_TILES) if (sd.tiles.every(t => S.tiles[t].owner === i)) return { kind: 'line', side: sd.id };
    if (SPOTS.every(t => S.tiles[t].owner === i)) return { kind: 'spots' };
    return null;
  }
  // pemain yang tinggal SATU petak lagi menuju menang instan → [{ p, tile, kind, group?, side? }]
  function winThreats(S) {
    if (!S.settings.instantWin || S.over) return [];
    const out = [];
    activeIdx(S).forEach(i => {
      const need = new Map();
      const fg = fullGroups(S, i);
      if (fg.length >= RULES.tripleGroups - 1) GROUP_IDS.forEach(g => {
        if (fg.includes(g)) return;
        const miss = GROUP_TILES[g].filter(t => S.tiles[t].owner !== i);
        if (miss.length === 1 && !need.has(miss[0])) need.set(miss[0], { kind: 'triple', group: g });
      });
      SIDE_TILES.forEach(sd => {
        const miss = sd.tiles.filter(t => S.tiles[t].owner !== i);
        if (miss.length === 1 && !need.has(miss[0])) need.set(miss[0], { kind: 'line', side: sd.id });
      });
      const ms = SPOTS.filter(t => S.tiles[t].owner !== i);
      if (ms.length === 1 && !need.has(ms[0])) need.set(ms[0], { kind: 'spots' });
      need.forEach((v, t) => out.push(Object.assign({ p: i, tile: t }, v)));
    });
    return out;
  }
  function takeoverPrice(S, ti) { return Math.round(tileValue(S, ti) * RULES.takeoverMult); }
  function canTakeover(S, i, ti) {
    if (!S.settings.takeover) return { ok: false, reason: 'Aturan ambil alih tidak aktif.' };
    const t = TILES[ti], st = S.tiles[ti];
    if (!t || !t.price) return { ok: false, reason: 'Petak ini tidak bisa dimiliki.' };
    const o = st.owner;
    if (o < 0 || o === i || PL(S, o).bankrupt) return { ok: false, reason: 'Bukan milik lawan.' };
    if (t.type === 'spot') return { ok: false, reason: 'Tempat wisata tidak bisa diambil alih.', spot: true };
    if (st.level >= 4) return { ok: false, reason: 'Landmark kebal diambil alih.', landmark: true };
    const price = takeoverPrice(S, ti);
    if (PL(S, i).cash < price) return { ok: false, reason: 'Uang kurang (butuh ' + fmt(price) + ').', price };
    return { ok: true, price };
  }
  function offerTakeover(S, i, ti) {
    if (!S.settings.takeover || S.over || PL(S, i).bankrupt) return;
    const c = canTakeover(S, i, ti);
    if (c.ok) qadd(S, { type: 'TAKEOVER', p: i, tile: ti, owner: S.tiles[ti].owner, price: c.price });
  }
  function offerUpgrade(S, i, ti, src) {
    const lv = upgradeLevels(S, i, ti);
    if (!lv.length) return false;
    if (PL(S, i).cash < upgradeCost(S, i, ti, lv[0])) {
      log(S, PL(S, i).name + ' belum cukup uang untuk membangun ' + LEVEL_NAME[lv[0]] + ' di ' + TILES[ti].name + '.', 'dot', i);
      return false;
    }
    qadd(S, { type: 'UPGRADE', p: i, tile: ti, src: src || 'visit' });
    return true;
  }

  // ---------- pembuatan game ----------
  function newPlayer(src, i, cash) {
    return {
      i,
      name: String(src.name || ('Pemain ' + (i + 1))).trim().slice(0, 16) || ('Pemain ' + (i + 1)),
      avatar: String(src.avatar || D.AVATARS[i % D.AVATARS.length]).slice(0, 8),
      color: /^#[0-9a-fA-F]{6}$/.test(src.color || '') ? src.color : D.TOKEN_COLORS[i % D.TOKEN_COLORS.length],
      kind: src.kind === 'ai' ? 'ai' : 'human',
      ai: AI_LEVELS.includes(src.ai) ? src.ai : 'normal',
      uid: src.uid || null,
      cash, pos: 0, laps: 0, island: false, islandTries: 0, islandCh: false, tour: false, skip: 0, bankrupt: false,
      love: RULES.loveStart, cards: [], discount: 0, achievements: [],
      stats: {
        tollIn: 0, tollOut: 0, bought: 0, built: 0, landmarks: 0, takeovers: 0, takenFrom: 0, festivals: 0, travels: 0,
        islands: 0, escapes: 0, challenges: 0, skipped: 0, failed: 0, letters: 0, doubles: 0, aimHits: 0, debts: 0,
        survived: 0, angels: 0, earned: 0, spent: 0, transactions: 0, maxNet: cash, bankruptRound: 0, sold: 0, starts: 0
      }
    };
  }

  function create(setup) {
    if (!setup || !Array.isArray(setup.players) || setup.players.length < 2 || setup.players.length > 4) {
      throw new Error('Butuh 2–4 pemain.');
    }
    const st = setup.settings || {};
    const settings = {
      startCash: clampInt(st.startCash == null ? RULES.startCash : st.startCash, 1000, 6000),
      roundLimit: clampInt(st.roundLimit == null ? 30 : st.roundLimit, 0, 200),
      winMessage: String(st.winMessage || '').slice(0, 240),
      online: !!st.online,
      debug: !!st.debug,
      takeover: st.takeover !== false,
      instantWin: st.instantWin !== false,
      diceControl: st.diceControl !== false
    };
    const seed = (Number(setup.seed) >>> 0) || ((Math.random() * 4294967296) >>> 0) || 1;
    const S = {
      v: 2, seq: 0, rng: seed, seed, settings,
      players: setup.players.map((p, i) => newPlayer(p, i, settings.startCash)),
      tiles: TILES.map(() => ({ owner: -1, level: 0 })),
      festival: { tile: -1, mult: 1 },
      turn: { p: 0, rolled: false, doubles: 0, canRollAgain: false, dice: [0, 0], rollId: 0 },
      round: 1, queue: [],
      decks: { card: [], challenge: {} },
      log: [], logN: 0, letters: [],
      lastEvents: [], evSeq: 0, over: null, paused: false
    };
    S.decks.card = shuffle(S, CARDS.map(c => c.id));
    Object.keys(CH_TYPES).forEach(type => { S.decks.challenge[type] = shuffle(S, CHALLENGES.filter(c => c.type === type).map(c => c.id)); });
    log(S, 'Permainan dimulai. Selamat keliling dunia berdua!', 'heart');
    return S;
  }

  // ---------- gerak ----------
  function passStart(S, i) {
    const p = PL(S, i);
    const pay = RULES.salary + tierInfo(p.love).salary;
    p.laps++;
    p.stats.starts++;
    cashAdd(S, i, pay);
    loveAdd(S, i, 1);
    ev(S, { t: 'salary', p: i, amount: pay, laps: p.laps });
    log(S, p.name + ' melewati START: gaji ' + fmt(pay) + '.' + (p.laps === RULES.hotelLaps ? ' Hotel sekarang bisa dibangun!' : ''), 'coins', i);
  }
  function walk(S, i, steps) {
    const p = PL(S, i), from = p.pos;
    ev(S, { t: 'move', p: i, from, to: (from + steps) % N, steps, kind: 'walk' });
    for (let k = 0; k < steps; k++) { p.pos = (p.pos + 1) % N; if (p.pos === 0) passStart(S, i); }
  }
  function walkBack(S, i, steps) {
    const p = PL(S, i), from = p.pos;
    p.pos = (p.pos - steps + N) % N;
    ev(S, { t: 'move', p: i, from, to: p.pos, steps: -steps, kind: 'walk' });
  }
  function advanceTo(S, i, target) {
    const steps = (target - PL(S, i).pos + N) % N;
    if (steps > 0) walk(S, i, steps);
  }
  function flyTo(S, i, target, kind) {
    const p = PL(S, i), from = p.pos;
    if (target === from) return;
    ev(S, { t: 'move', p: i, from, to: target, steps: 0, kind: kind || 'jump' });
    if (target < from || target === 0) passStart(S, i);
    p.pos = target;
  }
  function sendToIsland(S, i, why) {
    const p = PL(S, i), from = p.pos;
    p.pos = ISLAND; p.island = true; p.islandTries = 0; p.islandCh = false; p.tour = false;
    p.stats.islands++;
    if (S.turn.p === i) { S.turn.canRollAgain = false; S.turn.doubles = 0; }
    loveAdd(S, i, -3);
    if (from !== ISLAND) ev(S, { t: 'move', p: i, from, to: ISLAND, steps: 0, kind: 'jump' });
    ev(S, { t: 'island', p: i });
    log(S, p.name + ' terdampar di Pulau Rindu' + (why ? ' (' + why + ')' : '') + '.', 'island', i);
  }
  function release(S, i, how) {
    const p = PL(S, i);
    p.island = false; p.islandTries = 0;
    log(S, p.name + ' meninggalkan Pulau Rindu ' + how + '.', 'boat', i);
    ev(S, { t: 'free', p: i });
  }
  function nearestTile(pos, kind) {
    for (let k = 1; k <= N; k++) {
      const t = TILES[(pos + k) % N];
      if (t.type === kind) return t.i;
    }
    return pos;
  }

  // ---------- mendarat ----------
  function land(S, i) {
    const p = PL(S, i);
    const t = TILES[p.pos];
    switch (t.type) {
      case 'city': case 'spot': landOwnable(S, i, t); break;
      case 'card': drawCard(S, i); break;
      case 'tax': {
        const amt = Math.round(netWorth(S, i) * RULES.taxRate / 10) * 10;
        if (amt > 0) qadd(S, { type: 'TAX', p: i, amount: amt });
        else log(S, p.name + ' bebas Pajak Rindu (aset kosong).', 'dot', i);
        break;
      }
      case 'start': offerTarget(S, i, 'build', 'start'); break;
      case 'island': sendToIsland(S, i, ''); break;
      case 'fest': offerTarget(S, i, 'festival', 'corner'); break;
      case 'travel':
        p.tour = true;
        if (S.turn.p === i) { S.turn.canRollAgain = false; }
        log(S, p.name + ' tiba di World Tour. Giliran depan bisa terbang ke mana saja!', 'plane', i);
        ev(S, { t: 'tour', p: i });
        break;
      default: break;
    }
  }
  function landOwnable(S, i, t) {
    const st = S.tiles[t.i];
    const p = PL(S, i);
    if (st.owner === -1) {
      if (p.cash < buyCost(S, i, t.i, 0)) { log(S, p.name + ' belum cukup uang untuk membeli ' + t.name + '.', 'dot', i); return; }
      qadd(S, { type: 'BUY', p: i, tile: t.i });
      return;
    }
    if (st.owner === i) {
      if (t.type === 'city') offerUpgrade(S, i, t.i, 'visit');
      return;
    }
    const amount = rentFor(S, t.i, i);
    if (amount <= 0) { offerTakeover(S, i, t.i); return; }
    qadd(S, { type: 'RENT', p: i, to: st.owner, tile: t.i, amount, base: amount, discountUsed: false });
  }
  // pilihan petak di papan (festival, bangun dari START, kartu aksi)
  function targetCandidates(S, i, kind) {
    const p = PL(S, i);
    if (kind === 'festival') return citiesOf(S, i);
    if (kind === 'build') return citiesOf(S, i).filter(t => { const lv = upgradeLevels(S, i, t); return lv.length && p.cash >= upgradeCost(S, i, t, lv[0]); });
    if (kind === 'renov') return citiesOf(S, i).filter(t => upgradeLevels(S, i, t).length);
    if (kind === 'storm') return CITIES.filter(t => { const st = S.tiles[t]; return st.owner >= 0 && st.owner !== i && !PL(S, st.owner).bankrupt && st.level >= 1 && st.level < 4; });
    if (kind === 'swap') return citiesOf(S, i).filter(t => S.tiles[t].level < 4);
    return [];
  }
  function swapTargets(S, i) { return CITIES.filter(t => { const st = S.tiles[t]; return st.owner >= 0 && st.owner !== i && !PL(S, st.owner).bankrupt && st.level < 4; }); }
  const TARGET_NONE = {
    festival: 'belum punya kota untuk festival',
    build: 'belum ada kota yang bisa dibangun',
    renov: 'belum ada kota yang bisa direnovasi',
    storm: 'tidak ada kota lawan yang terkena badai',
    swap: 'belum ada kota yang bisa ditukar'
  };
  function offerTarget(S, i, kind, src) {
    const c = targetCandidates(S, i, kind);
    if (!c.length || (kind === 'swap' && !swapTargets(S, i).length)) {
      log(S, PL(S, i).name + ' ' + TARGET_NONE[kind] + '.', 'dot', i);
      return false;
    }
    qadd(S, { type: 'TARGET', p: i, kind, src: src || 'card' });
    return true;
  }

  // ---------- kartu ----------
  function drawCard(S, i) {
    const d = S.decks.card;
    if (!d.length) { log(S, 'Tumpukan Kartu Cinta sedang kosong.', 'dot', i); return; }
    const id = d.shift();
    if (!CARD[id].power) d.push(id);
    qadd(S, { type: 'CARD', p: i, card: id });
    ev(S, { t: 'card', p: i, card: id });
  }
  function returnPowerCard(S, id) { if (CARD[id]) S.decks.card.push(id); }
  function takePower(S, i, kind) {
    const p = PL(S, i);
    const id = p.cards.find(c => CARD[c].power === kind);
    if (!id) return null;
    p.cards.splice(p.cards.indexOf(id), 1);
    returnPowerCard(S, id);
    ev(S, { t: 'power', p: i, power: kind });
    return id;
  }

  function applyFx(S, i, fx) {
    const p = PL(S, i);
    for (const e of fx) {
      if (e.gain != null) cashAdd(S, i, e.gain);
      if (e.pay != null) charge(S, i, e.pay, -1, 'biaya kartu');
      if (e.love != null) loveAdd(S, i, e.love);
      if (e.collectEach != null) activeIdx(S).forEach(j => { if (j !== i) charge(S, j, e.collectEach, i, 'hadiah untuk ' + p.name); });
      if (e.payEach != null) activeIdx(S).forEach(j => { if (j !== i) charge(S, i, e.payEach, j, 'traktiran untuk ' + PL(S, j).name); });
      if (e.repairs != null) {
        const n = buildingLevels(S, i);
        if (n) charge(S, i, n * e.repairs, -1, 'servis bangunan'); else log(S, p.name + ' belum punya bangunan. Aman!', 'dot', i);
      }
      if (e.moveTo != null) { advanceTo(S, i, e.moveTo); land(S, i); }
      if (e.moveBack != null) { walkBack(S, i, e.moveBack); land(S, i); }
      if (e.nearest) { advanceTo(S, i, nearestTile(p.pos, e.nearest)); land(S, i); }
      if (e.goIsland) sendToIsland(S, i, 'kartu');
      if (e.skipTurn) { p.skip += e.skipTurn; log(S, p.name + ' akan kehilangan giliran berikutnya.', 'pause', i); }
      if (e.discount) { p.discount = Math.max(p.discount, e.discount); log(S, p.name + ' punya voucher diskon ' + Math.round(e.discount * 100) + '% untuk beli/bangun berikutnya.', 'ticket', i); }
      if (e.target) offerTarget(S, i, e.target, 'card');
      if (e.challenge) qadd(S, chItem(S, i, e.challenge, 'card'));
      if (e.richToPoor != null) {
        const act = activeIdx(S).slice().sort((a, b) => PL(S, b).cash - PL(S, a).cash);
        const rich = act[0], poor = act[act.length - 1];
        if (rich !== poor && PL(S, rich).cash > PL(S, poor).cash) {
          charge(S, rich, e.richToPoor, poor, 'traktiran untuk ' + PL(S, poor).name);
          log(S, PL(S, rich).name + ' (uang terbanyak) mentraktir ' + PL(S, poor).name + '.', 'coins', rich);
        } else log(S, 'Uang semua pemain setara. Tidak ada traktiran.', 'dot', i);
      }
    }
  }

  // ---------- tantangan ----------
  const RINDU_TYPES = ['quiz', 'memory', 'truthdare', 'message', 'guess', 'minigame'];
  const ANY_TYPES = ['quiz', 'memory', 'truthdare', 'message', 'guess', 'dilemma', 'minigame'];
  function drawChallenge(S, cat) {
    let type = cat;
    if (cat === 'any') type = ANY_TYPES[rint(S, ANY_TYPES.length)];
    else if (cat === 'rindu') type = RINDU_TYPES[rint(S, RINDU_TYPES.length)];
    const deck = S.decks.challenge[type];
    const id = deck.shift(); deck.push(id);
    return id;
  }
  function chItem(S, i, cat, source) { return { type: 'CHALLENGE', p: i, ch: drawChallenge(S, cat), cat, source, redraws: 0 }; }

  // ---------- pembayaran & utang ----------
  function charge(S, i, amt, to, reason, opts) {
    opts = opts || {};
    amt = Math.round(amt);
    if (amt <= 0) return true;
    const p = PL(S, i);
    if (to >= 0 && PL(S, to).bankrupt) to = -1;
    if (p.cash >= amt) { transfer(S, i, to, amt, opts); return true; }
    qadd(S, { type: 'DEBT', p: i, to, amount: amt, reason, rent: !!opts.rent, tile: opts.tile == null ? -1 : opts.tile });
    p.stats.debts++;
    log(S, p.name + ' kekurangan uang untuk ' + reason + ' (' + fmt(amt) + ').', 'alert', i);
    return false;
  }
  function transfer(S, from, to, amt, opts) {
    opts = opts || {};
    cashAdd(S, from, -amt);
    if (to >= 0) cashAdd(S, to, amt);
    if (opts.rent && to >= 0) {
      PL(S, from).stats.tollOut += amt;
      PL(S, to).stats.tollIn += amt;
    }
  }
  function resetTile(S, ti) {
    const st = S.tiles[ti];
    st.owner = -1; st.level = 0;
    if (S.festival.tile === ti) S.festival = { tile: -1, mult: 1 };
  }

  function bankrupt(S, i, creditor) {
    const p = PL(S, i);
    let total = p.cash;
    ownedBy(S, i).forEach(t => { total += sellValue(S, t); resetTile(S, t); });
    if (p.cash) cashAdd(S, i, -p.cash);
    const cr = creditor >= 0 && !PL(S, creditor).bankrupt && creditor !== i ? creditor : -1;
    if (cr >= 0 && total > 0) cashAdd(S, cr, total);
    p.cards.forEach(id => returnPowerCard(S, id));
    p.cards = [];
    p.bankrupt = true; p.island = false; p.tour = false; p.skip = 0; p.discount = 0; p.stats.bankruptRound = S.round;
    log(S, p.name + ' bangkrut! Semua kotanya dijual ke bank' + (cr >= 0 ? ' dan hasilnya (' + fmt(total) + ') untuk ' + PL(S, cr).name : '') + '.', 'alert', i);
    const keep = it => !(it.p === i || (it.type === 'TAKEOVER' && it.owner === i));
    const fix = it => { if ((it.type === 'DEBT' || it.type === 'RENT') && it.to === i) it.to = -1; return it; };
    S.queue = S.queue.filter(keep).map(fix);
    S._new = S._new.filter(keep).map(fix);
    // tol ke pemain yang bangkrut tidak perlu dibayar lagi
    S.queue = S.queue.filter(it => !(it.type === 'RENT' && it.to === -1));
    S._new = S._new.filter(it => !(it.type === 'RENT' && it.to === -1));
    ev(S, { t: 'bankrupt', p: i });
    const act = activeIdx(S);
    if (act.length <= 1) { finish(S, 'bankrupt', act[0]); return; }
    if (S.turn.p === i) nextTurn(S);
  }

  // ---------- giliran & ronde ----------
  function beginTurn(S, p) {
    S.turn = { p, rolled: false, doubles: 0, canRollAgain: false, dice: [0, 0], rollId: S.turn.rollId };
    const pl = PL(S, p);
    if (pl.skip > 0) {
      pl.skip--;
      log(S, pl.name + ' kehilangan giliran ini.', 'pause', p);
      ev(S, { t: 'skip', p });
      nextTurn(S);
      return;
    }
    if (pl.tour && !pl.island) qadd(S, { type: 'TOUR', p });
  }
  function nextTurn(S) {
    if (S.over) return;
    const n = S.players.length, cur = S.turn.p;
    let next = -1, newRound = false;
    for (let k = 1; k <= n; k++) {
      const c = (cur + k) % n;
      if (!S.players[c].bankrupt) { next = c; newRound = (cur + k) >= n; break; }
    }
    if (next < 0) return;
    if (newRound) { S.round++; if (startRound(S)) return; }
    beginTurn(S, next);
  }
  function startRound(S) {
    if ((S.settings.roundLimit && S.round > S.settings.roundLimit) || S.round > RULES.maxRounds) {
      S.round = Math.min(S.round, S.settings.roundLimit || S.round);
      finish(S, 'rounds');
      return true;
    }
    return false;
  }

  function finish(S, reason, winner, detail) {
    if (S.over) return;
    const ranking = S.players.map(p => p.i).sort((a, b) => {
      const A = PL(S, a), B = PL(S, b);
      if (A.bankrupt !== B.bankrupt) return A.bankrupt ? 1 : -1;
      if (A.bankrupt && B.bankrupt) return B.stats.bankruptRound - A.stats.bankruptRound;
      return netWorth(S, b) - netWorth(S, a);
    });
    if (winner == null || winner < 0) winner = ranking[0];
    else ranking.splice(ranking.indexOf(winner), 1), ranking.unshift(winner);
    S.players.forEach(p => { if (!p.bankrupt) p.stats.maxNet = Math.max(p.stats.maxNet, netWorth(S, p.i)); });
    checkAchievements(S);
    S.over = { winner, reason, detail: detail || null, ranking, round: S.round, worth: S.players.map(p => netWorth(S, p.i)), titles: computeTitles(S, ranking, winner) };
    S.queue = []; S._new = [];
    log(S, PL(S, winner).name + ' menang (' + winReason(S.over) + ')!', 'trophy', winner);
    ev(S, { t: 'gameover', winner, reason });
  }
  function sideName(id) { return (SIDE_TILES.find(x => x.id === id) || {}).name || 'satu jalur'; }
  function winReason(o) {
    return {
      bankrupt: 'semua lawan bangkrut', rounds: 'aset terbesar saat batas ronde', manual: 'aset terbesar saat permainan diakhiri', resign: 'lawan menyerah',
      triple: 'Triple Monopoli', line: 'Monopoli ' + (o.detail ? sideName(o.detail.side) : 'Jalur'), spots: 'Monopoli Wisata'
    }[o.reason] || o.reason;
  }
  function computeTitles(S, ranking, winner) {
    const titles = {};
    const used = new Set();
    titles[winner] = D.TITLES.winner[rint(S, D.TITLES.winner.length)];
    const cats = [
      ['rent', p => p.stats.tollIn], ['landmarks', p => p.stats.landmarks], ['takeovers', p => p.stats.takeovers],
      ['challenges', p => p.stats.challenges], ['love', p => p.love], ['travels', p => p.stats.travels],
      ['doubles', p => p.stats.doubles], ['island', p => p.stats.islands]
    ];
    S.players.forEach(p => {
      if (p.i === winner) return;
      for (const [k, f] of cats) {
        if (used.has(k)) continue;
        const v = f(p);
        if (v > 0 && S.players.every(q => q.i === p.i || f(q) < v)) { titles[p.i] = D.TITLES[k]; used.add(k); break; }
      }
      if (!titles[p.i]) titles[p.i] = D.TITLES.default[p.i % D.TITLES.default.length];
    });
    return titles;
  }

  function checkAchievements(S) {
    S.players.forEach(p => {
      if (p.bankrupt) return;
      const s = p.stats;
      const cond = {
        landmark: s.landmarks >= 1, tycoon: citiesOf(S, p.i).length >= 8, monopoly2: fullGroups(S, p.i).length >= 2,
        festival: s.festivals >= 1, globe: s.travels >= 1, takeover: s.takeovers >= 1, tourist: spotsOf(S, p.i).length >= 3,
        rentking: s.tollIn >= 3000, romantic: s.challenges >= 5, escape: s.escapes >= 1, angel: s.angels >= 1,
        goals: p.love >= 100, doubles5: s.doubles >= 5, writer: s.letters >= 3, survivor: s.survived >= 1
      };
      Object.keys(cond).forEach(id => {
        if (cond[id] && !p.achievements.includes(id)) {
          p.achievements.push(id);
          log(S, 'Achievement: ' + p.name + ' membuka "' + ACH[id].name + '".', 'trophy', p.i);
          ev(S, { t: 'achievement', p: p.i, id });
        }
      });
    });
  }

  // ---------- aktor & ketersediaan aksi ----------
  function actor(S) {
    if (S.over) return -1;
    const it = S.queue[0];
    return it ? it.p : S.turn.p;
  }
  function head(S, type, p) {
    const it = S.queue[0];
    if (!it || it.type !== type) fail('Tidak ada keputusan yang menunggu untuk aksi ini.');
    if (p != null && actor(S) !== p) fail('Bukan giliranmu untuk keputusan ini.');
    return it;
  }
  function canRoll(S, i) {
    if (S.over || S.paused || S.queue.length || S.turn.p !== i) return false;
    const p = PL(S, i);
    if (p.island) return !S.turn.rolled;
    return !S.turn.rolled || S.turn.canRollAgain;
  }
  function canEnd(S, i) {
    if (S.over || S.paused || S.queue.length || S.turn.p !== i) return false;
    return S.turn.rolled && !S.turn.canRollAgain;
  }
  const islandPre = (S, i) => { const p = PL(S, i); return p.island && S.turn.p === i && !S.turn.rolled && !S.queue.length && !S.over && !S.paused; };

  // ---------- handler aksi ----------
  const H = {};
  H.PAUSE = (S, a) => { S.paused = !S.paused; log(S, PL(S, a.p).name + (S.paused ? ' menjeda permainan.' : ' melanjutkan permainan.'), 'pause', a.p); };

  H.ROLL = (S, a) => {
    const i = a.p, p = PL(S, i);
    if (!canRoll(S, i)) fail(S.queue.length ? 'Selesaikan dulu keputusan yang ada.' : 'Kamu tidak bisa melempar dadu sekarang.');
    let d1 = 1 + rint(S, 6), d2 = 1 + rint(S, 6);
    const aim = S.settings.diceControl && !p.island && typeof a.aim === 'string' && RULES.aimRanges[a.aim] ? a.aim : null;
    if (aim) {
      const [lo, hi] = RULES.aimRanges[aim];
      if (rnd(S) < RULES.aimChance) {
        for (let k = 0; k < 200 && (d1 + d2 < lo || d1 + d2 > hi); k++) { d1 = 1 + rint(S, 6); d2 = 1 + rint(S, 6); }
      }
    }
    if (S.settings.debug && Array.isArray(a.dice) && a.dice.length === 2) { d1 = clampInt(a.dice[0], 1, 6); d2 = clampInt(a.dice[1], 1, 6); }
    const dbl = d1 === d2;
    const hit = !!aim && d1 + d2 >= RULES.aimRanges[aim][0] && d1 + d2 <= RULES.aimRanges[aim][1];
    if (hit) p.stats.aimHits++;
    S.turn.dice = [d1, d2];
    S.turn.rollId++;
    ev(S, { t: 'dice', p: i, d: [d1, d2], dbl, aim, hit });
    if (p.island) {
      S.turn.rolled = true; S.turn.canRollAgain = false;
      if (dbl) {
        p.stats.doubles++;
        release(S, i, 'dengan dadu kembar ' + d1 + '-' + d2);
        walk(S, i, d1 + d2); land(S, i);
        return;
      }
      p.islandTries++;
      if (p.islandTries >= RULES.islandTurns) {
        release(S, i, 'karena kapal penjemput datang');
        walk(S, i, d1 + d2); land(S, i);
      } else {
        log(S, p.name + ' belum dapat dadu kembar (' + d1 + '-' + d2 + '). Percobaan ' + p.islandTries + '/' + RULES.islandTurns + '.', 'dice', i);
      }
      return;
    }
    S.turn.rolled = true;
    log(S, p.name + ' melempar ' + d1 + ' + ' + d2 + ' = ' + (d1 + d2) + (dbl ? ' (kembar!)' : '') + (aim ? ' · bidikan ' + AIM_LABEL[aim] + (hit ? ' tepat' : ' meleset') : '') + '.', 'dice', i);
    if (dbl) {
      S.turn.doubles++; p.stats.doubles++;
      loveAdd(S, i, 2);
      if (S.turn.doubles >= 3) { S.turn.canRollAgain = false; sendToIsland(S, i, '3× dadu kembar'); return; }
      S.turn.canRollAgain = true;
    } else S.turn.canRollAgain = false;
    walk(S, i, d1 + d2);
    land(S, i);
  };

  H.END_TURN = (S, a) => {
    if (!canEnd(S, a.p)) fail(S.turn.canRollAgain ? 'Kamu dapat dadu kembar: lempar lagi dulu.' : 'Belum bisa mengakhiri giliran.');
    nextTurn(S);
  };

  // --- beli kota / wisata (tanah + bangunan sekaligus) ---
  H.BUY = (S, a) => {
    const it = head(S, 'BUY', a.p);
    const p = PL(S, a.p), t = TILES[it.tile];
    const level = clampInt(a.level || 0, 0, 4);
    if (S.tiles[it.tile].owner !== -1) fail('Petak ini sudah dimiliki.');
    if (!buyLevels(S, a.p, it.tile).includes(level)) fail(level === 3 ? 'Hotel baru bisa dibangun setelah 1 putaran (lewat START).' : 'Tingkat bangunan tidak valid.');
    const cost = buyCost(S, a.p, it.tile, level);
    if (p.cash < cost) fail('Uang tidak cukup (butuh ' + fmt(cost) + ').');
    S.queue.shift();
    if (cost) cashAdd(S, a.p, -cost);
    if (p.discount) { p.discount = 0; }
    S.tiles[it.tile].owner = a.p;
    S.tiles[it.tile].level = level;
    p.stats.bought++;
    if (level > 0) p.stats.built += level;
    log(S, p.name + ' membeli ' + t.name + (level > 0 ? ' + ' + LEVEL_NAME[level] : '') + ' seharga ' + fmt(cost) + '.', 'flag', a.p);
    ev(S, { t: 'buy', p: a.p, tile: it.tile, level });
  };
  H.BUY_SKIP = (S, a) => {
    const it = head(S, 'BUY', a.p);
    S.queue.shift();
    log(S, PL(S, a.p).name + ' tidak membeli ' + TILES[it.tile].name + '.', 'dot', a.p);
  };

  // --- bangun di kota sendiri ---
  function applyLevel(S, i, ti, level, cost, why) {
    const st = S.tiles[ti], p = PL(S, i), from = st.level;
    if (cost) cashAdd(S, i, -cost);
    st.level = level;
    p.stats.built += level - from;
    if (level === 4) p.stats.landmarks++;
    log(S, p.name + ' membangun ' + LEVEL_NAME[level] + ' di ' + TILES[ti].name + (cost ? ' (' + fmt(cost) + ')' : ' (gratis)') + (why ? ' · ' + why : '') + '.', level === 4 ? 'crown' : 'build', i);
    ev(S, { t: 'build', p: i, tile: ti, level, from });
  }
  H.UPGRADE = (S, a) => {
    const it = head(S, 'UPGRADE', a.p);
    const p = PL(S, a.p);
    const level = clampInt(a.level, 0, 4);
    const ok = upgradeLevels(S, a.p, it.tile);
    if (!ok.includes(level)) fail(level === 4 ? 'Landmark hanya bisa dibangun di kota yang sudah punya Hotel.' : level === 3 ? 'Hotel baru bisa dibangun setelah 1 putaran (lewat START).' : 'Tingkat bangunan tidak valid.');
    const cost = upgradeCost(S, a.p, it.tile, level);
    if (p.cash < cost) fail('Uang tidak cukup (butuh ' + fmt(cost) + ').');
    S.queue.shift();
    if (p.discount) p.discount = 0;
    applyLevel(S, a.p, it.tile, level, cost);
  };
  H.UPGRADE_SKIP = (S, a) => { head(S, 'UPGRADE', a.p); S.queue.shift(); };

  // --- tol & ambil alih ---
  H.PAY_RENT = (S, a) => {
    const it = head(S, 'RENT', a.p);
    S.queue.shift();
    const p = PL(S, a.p);
    const to = PL(S, it.to);
    if (to.bankrupt || S.tiles[it.tile].owner !== it.to) { log(S, 'Pemilik sudah berubah, tol dibatalkan.', 'dot', a.p); return; }
    if (p.cash >= it.amount) {
      transfer(S, a.p, it.to, it.amount, { rent: true });
      log(S, p.name + ' membayar tol ' + fmt(it.amount) + ' ke ' + to.name + ' di ' + TILES[it.tile].name + '.', 'coins', a.p);
      ev(S, { t: 'rent', p: a.p, to: it.to, amount: it.amount, tile: it.tile });
      offerTakeover(S, a.p, it.tile);
    } else {
      charge(S, a.p, it.amount, it.to, 'tol ' + TILES[it.tile].name, { rent: true, tile: it.tile });
    }
  };
  H.USE_ANGEL = (S, a) => {
    const it = head(S, 'RENT', a.p);
    const p = PL(S, a.p);
    if (!takePower(S, a.p, 'angel')) fail('Kamu tidak punya Malaikat Cinta.');
    S.queue.shift();
    p.stats.angels++;
    log(S, p.name + ' memakai Malaikat Cinta: tol ' + fmt(it.amount) + ' di ' + TILES[it.tile].name + ' jadi 0.', 'angel', a.p);
    offerTakeover(S, a.p, it.tile);
  };
  H.USE_DISCOUNT = (S, a) => {
    const it = head(S, 'RENT', a.p);
    if (it.discountUsed) fail('Kupon sudah dipakai untuk tol ini.');
    if (!takePower(S, a.p, 'discount')) fail('Kamu tidak punya Kupon Tol 50%.');
    it.discountUsed = true;
    it.amount = r5(it.amount / 2);
    log(S, PL(S, a.p).name + ' memakai Kupon Tol 50%: tol jadi ' + fmt(it.amount) + '.', 'ticket', a.p);
  };
  H.TAKEOVER_BUY = (S, a) => {
    const it = head(S, 'TAKEOVER', a.p);
    if (S.tiles[it.tile].owner !== it.owner) fail('Pemilik kota sudah berubah.');
    const c = canTakeover(S, a.p, it.tile);
    if (!c.ok) fail(c.reason);
    S.queue.shift();
    const p = PL(S, a.p), o = PL(S, it.owner);
    transfer(S, a.p, it.owner, c.price, {});
    S.tiles[it.tile].owner = a.p;
    p.stats.takeovers++; o.stats.takenFrom++; p.stats.bought++;
    log(S, p.name + ' mengambil alih ' + TILES[it.tile].name + ' dari ' + o.name + ' seharga ' + fmt(c.price) + '!', 'swap', a.p);
    ev(S, { t: 'takeover', p: a.p, from: it.owner, tile: it.tile, price: c.price });
    if (TILES[it.tile].type === 'city') offerUpgrade(S, a.p, it.tile, 'takeover');
  };
  H.TAKEOVER_SKIP = (S, a) => {
    const it = head(S, 'TAKEOVER', a.p);
    S.queue.shift();
    log(S, PL(S, a.p).name + ' tidak mengambil alih ' + TILES[it.tile].name + '.', 'dot', a.p);
  };
  H.PAY_TAX = (S, a) => {
    const it = head(S, 'TAX', a.p);
    S.queue.shift();
    const ok = charge(S, a.p, it.amount, -1, 'Pajak Rindu');
    if (ok) { log(S, PL(S, a.p).name + ' membayar Pajak Rindu ' + fmt(it.amount) + '.', 'tax', a.p); ev(S, { t: 'tax', p: a.p, amount: it.amount }); }
  };

  // --- utang ---
  H.SELL = (S, a) => {
    const it = head(S, 'DEBT', a.p);
    const ti = Math.round(Number(a.tile));
    if (!TILES[ti] || !TILES[ti].price || S.tiles[ti].owner !== a.p) fail('Pilih kota milikmu.');
    const v = sellValue(S, ti);
    resetTile(S, ti);
    cashAdd(S, a.p, v);
    PL(S, a.p).stats.sold++;
    log(S, PL(S, a.p).name + ' menjual ' + TILES[ti].name + ' ke bank (+' + fmt(v) + ').', 'bank', a.p);
    ev(S, { t: 'sell', p: a.p, tile: ti, value: v });
    void it;
  };
  H.PAY_DEBT = (S, a) => {
    const it = head(S, 'DEBT', a.p);
    const p = PL(S, a.p);
    if (p.cash < it.amount) fail('Uang belum cukup. Jual kota dulu.');
    S.queue.shift();
    const to = it.to >= 0 && !PL(S, it.to).bankrupt ? it.to : -1;
    transfer(S, a.p, to, it.amount, { rent: it.rent && to >= 0 });
    p.stats.survived++;
    log(S, p.name + ' melunasi ' + it.reason + ' (' + fmt(it.amount) + ').', 'check', a.p);
    if (it.rent && to >= 0) {
      ev(S, { t: 'rent', p: a.p, to, amount: it.amount, tile: it.tile });
      if (it.tile >= 0 && S.tiles[it.tile].owner === to) offerTakeover(S, a.p, it.tile);
    }
  };
  H.BANKRUPT = (S, a) => {
    const it = head(S, 'DEBT', a.p);
    if (liquidation(S, a.p) >= it.amount) fail('Asetmu masih cukup. Jual kota untuk melunasi.');
    S.queue.shift();
    bankrupt(S, a.p, it.to);
  };
  H.RESIGN = (S, a) => {
    if (S.queue.length || S.turn.p !== a.p) fail('Menyerah hanya bisa di giliranmu tanpa keputusan tertunda.');
    log(S, PL(S, a.p).name + ' menyerah.', 'flag', a.p);
    bankrupt(S, a.p, -1);
    if (S.over && S.over.reason === 'bankrupt') S.over.reason = 'resign';
  };
  H.FINISH_NOW = (S, a) => {
    if (S.queue.length || S.turn.p !== a.p) fail('Hanya bisa di giliranmu tanpa keputusan tertunda.');
    finish(S, 'manual');
  };

  // --- kartu ---
  H.CARD_OK = (S, a) => {
    const it = head(S, 'CARD', a.p);
    const c = CARD[it.card];
    if (c.choice) fail('Pilih salah satu opsi kartu.');
    S.queue.shift();
    const p = PL(S, a.p);
    log(S, p.name + ' membuka Kartu Cinta "' + c.title + '".', 'letter', a.p);
    if (c.power) { p.cards.push(c.id); log(S, p.name + ' menyimpan kartu ' + c.title + '.', 'bolt', a.p); return; }
    applyFx(S, a.p, c.fx || []);
  };
  H.CARD_CHOOSE = (S, a) => {
    const it = head(S, 'CARD', a.p);
    const c = CARD[it.card];
    if (!c.choice) fail('Kartu ini tidak punya pilihan.');
    const opt = c.choice[a.choice];
    if (!opt) fail('Pilihan tidak valid.');
    S.queue.shift();
    log(S, PL(S, a.p).name + ' membuka "' + c.title + '" dan memilih: ' + opt.label + '.', 'letter', a.p);
    applyFx(S, a.p, opt.fx);
  };

  // --- pilih petak (festival, bangun dari START, kartu aksi) ---
  function hostFestival(S, i, ti, why) {
    const p = PL(S, i);
    if (S.festival.tile === ti) S.festival.mult = Math.min(RULES.festivalMax, S.festival.mult + 1);
    else S.festival = { tile: ti, mult: 2 };
    p.stats.festivals++;
    loveAdd(S, i, 3);
    log(S, 'Festival Cinta di ' + TILES[ti].name + '! Tol kota ini ×' + S.festival.mult + (why ? ' (' + why + ')' : '') + '.', 'party', i);
    ev(S, { t: 'festival', p: i, tile: ti, mult: S.festival.mult });
  }
  H.TARGET_PICK = (S, a) => {
    const it = head(S, 'TARGET', a.p);
    const ti = Math.round(Number(a.tile));
    const cand = targetCandidates(S, a.p, it.kind);
    if (!cand.includes(ti)) fail('Pilih petak yang menyala.');
    const p = PL(S, a.p);
    if (it.kind === 'swap') {
      const t2 = Math.round(Number(a.tile2));
      if (!swapTargets(S, a.p).includes(t2)) fail('Pilih kota lawan yang mau ditukar.');
      S.queue.shift();
      const other = S.tiles[t2].owner;
      S.tiles[ti].owner = other; S.tiles[t2].owner = a.p;
      log(S, p.name + ' menukar ' + TILES[ti].name + ' dengan ' + TILES[t2].name + ' milik ' + PL(S, other).name + '.', 'swap', a.p);
      ev(S, { t: 'swap', p: a.p, a: ti, b: t2, other });
      return;
    }
    S.queue.shift();
    if (it.kind === 'festival') hostFestival(S, a.p, ti, it.src === 'card' ? 'Festival Kilat' : '');
    else if (it.kind === 'build') { if (!offerUpgrade(S, a.p, ti, 'start')) fail('Kota ini belum bisa dibangun.'); }
    else if (it.kind === 'renov') {
      const lv = upgradeLevels(S, a.p, ti)[0];
      applyLevel(S, a.p, ti, lv, 0, 'Renovasi Gratis');
    } else if (it.kind === 'storm') {
      const st = S.tiles[ti], o = st.owner, from = st.level;
      st.level = from - 1;
      log(S, 'Badai Rindu menerjang ' + TILES[ti].name + ' milik ' + PL(S, o).name + ': ' + LEVEL_NAME[from] + ' turun jadi ' + LEVEL_NAME[st.level] + '.', 'storm', a.p);
      ev(S, { t: 'storm', p: a.p, tile: ti, level: st.level, from, owner: o });
    }
  };
  H.TARGET_SKIP = (S, a) => {
    const it = head(S, 'TARGET', a.p);
    S.queue.shift();
    log(S, PL(S, a.p).name + ' melewatkan ' + ({ festival: 'Festival Cinta', build: 'kesempatan membangun', renov: 'renovasi', storm: 'Badai Rindu', swap: 'Tukar Kota' }[it.kind] || 'pilihan') + '.', 'dot', a.p);
  };

  // --- World Tour ---
  H.TOUR_GO = (S, a) => {
    head(S, 'TOUR', a.p);
    const ti = Math.round(Number(a.tile));
    const p = PL(S, a.p);
    if (!TILES[ti] || ti === TRAVEL || ti === ISLAND) fail('Pilih tujuan lain.');
    const fee = RULES.travelFee;
    if (p.cash < fee) fail('Uang kurang untuk tiket (' + fee + ').');
    S.queue.shift();
    p.tour = false;
    cashAdd(S, a.p, -fee);
    p.stats.travels++;
    S.turn.rolled = true; S.turn.canRollAgain = false;
    log(S, p.name + ' terbang ke ' + TILES[ti].name + ' (tiket ' + fee + ').', 'plane', a.p);
    flyTo(S, a.p, ti, 'fly');
    land(S, a.p);
  };
  H.TOUR_SKIP = (S, a) => {
    head(S, 'TOUR', a.p);
    S.queue.shift();
    PL(S, a.p).tour = false;
    log(S, PL(S, a.p).name + ' memilih lempar dadu biasa.', 'dice', a.p);
  };

  // --- Pulau Rindu ---
  H.ISLAND_PAY = (S, a) => {
    if (!islandPre(S, a.p)) fail('Bayar hanya bisa sebelum melempar dadu saat di Pulau Rindu.');
    const p = PL(S, a.p);
    if (p.cash < RULES.islandFee) fail('Uang tidak cukup (' + RULES.islandFee + ').');
    cashAdd(S, a.p, -RULES.islandFee);
    release(S, a.p, 'dengan membayar perahu ' + RULES.islandFee);
  };
  H.ISLAND_CARD = (S, a) => {

  // ---------- pion ----------
  function tileBox(i) {
    const el = tileEl(i);
    if (!el) return { x: 0, y: 0, w: 10, h: 10 };
    return { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2, w: el.offsetWidth, h: el.offsetHeight };
  }
  // titik berdiri pion: di atas ilustrasi petak, supaya nama & harga tetap terbaca
  function tileAnchor(tile) {
    const b = tileBox(tile), side = tilePos(tile).side;
    if (is3d()) {
      // 3D: kartu pop-up berdiri di bagian depan petak; pion berdiri di depannya (baris atas/bawah & sudut)
      // atau di sisi dalam petak (kolom kiri/kanan), jadi kartu tidak pernah menutupi pion
      if (side === 'left') return { x: b.x + b.w * 0.23, y: b.y, w: b.h, v: true };
      if (side === 'right') return { x: b.x - b.w * 0.23, y: b.y, w: b.h, v: true };
      return { x: b.x, y: b.y + b.h * (side === 'corner' ? 0.32 : 0.29), w: b.w };
    }
    if (side === 'bottom') return { x: b.x, y: b.y + b.h * 0.02, w: b.w };
    if (side === 'top') return { x: b.x, y: b.y - b.h * 0.04, w: b.w };
    if (side === 'left') return { x: b.x - b.w * 0.2, y: b.y + b.h * 0.2, w: b.h };
    if (side === 'right') return { x: b.x + b.w * 0.2, y: b.y + b.h * 0.2, w: b.h };
    return { x: b.x, y: b.y + b.h * 0.12, w: b.w };
  }
  const SLOT2 = [[-0.55, 0], [0.55, 0]];
  const SLOT4 = [[-0.5, -0.32], [0.5, -0.32], [-0.5, 0.32], [0.5, 0.32]];
  // kolom kiri/kanan 3D: berjajar ke belakang (searah kedalaman) supaya tetap di sisi dalam petak
  const SLOT2V = [[0, -0.5], [0, 0.5]];
  const SLOT4V = [[-0.3, -0.5], [0.3, -0.5], [-0.3, 0.5], [0.3, 0.5]];
  function tokenXY(pi, tile, n) {
    const a = tileAnchor(tile);
    const S = App.S;
    const here = S ? S.players.filter(p => !p.bankrupt && p.pos === tile).map(p => p.i) : [pi];
    const k = Math.max(0, here.indexOf(pi));
    const many = n != null ? n : here.length;
    if (many <= 1) return { x: a.x, y: a.y };
    const sl = a.v ? (many === 2 ? SLOT2V : SLOT4V) : many === 2 ? SLOT2 : SLOT4;
    const [sx, sy] = sl[k % sl.length];
    const m = Math.min(a.w * 0.62, tokSize * 1.05);
    return { x: a.x + sx * m, y: a.y + sy * m };
  }
  let tokSize = 30;
  function ensureTokens(S) {
    const host = $('#tokens');

        el = document.createElement('div');
        el.className = 'token';
        el.id = 'tok-' + p.i;

        host.appendChild(el);

      if (av.textContent !== p.avatar) av.textContent = p.avatar;
      el.style.setProperty('--c', p.color);
      el.title = p.name;

    const bw = App.cam.L || ($('#board') ? $('#board').offsetWidth : 600);

  function renderTokens(S) {

  async function moveToken(e) {

    const bd = $('#board'), walker = App.S && App.S.players[e.p];

    await sleep(200 * SPD());

  const floatStack = {};

    boardFx('bfloat ' + cls, pt.x, pt.y - tokSize * 0.9 - st.n * Math.max(16, tokSize * 0.62), html, null, 1700);
  }
  function flyCoins(from, to, n) {
    if (reduceMotion() || !from || !to) return 0;
    const host = $('#tokens');
    if (!host || typeof host.animate !== 'function') return 0;
    const dist = Math.hypot(to.x - from.x, to.y - from.y);
    if (dist < 6) return 0;
    const lift = Math.min(160, 40 + dist * 0.3);
    const dur = Math.round((600 + Math.min(420, dist * 0.5)) * SPD());
    const gap = Math.round(70 * SPD());
    for (let k = 0; k < n; k++) {
      const c = document.createElement('i');
      c.className = 'coin';
      host.appendChild(c);
      const jx = (Math.random() - 0.5) * 20, jy = (Math.random() - 0.5) * 14;
      const x0 = from.x + jx, y0 = from.y + jy;
      const cx = (from.x + to.x) / 2 + jx * 1.5, cy = Math.min(from.y, to.y) - lift;
      const frames = [];
      for (let s = 0; s <= 12; s++) {
        const u = s / 12, v = 1 - u;
        const x = v * v * x0 + 2 * v * u * cx + u * u * to.x;
        const y = v * v * y0 + 2 * v * u * cy + u * u * to.y;
        const sc = u < 0.15 ? 0.45 + u / 0.15 * 0.55 : u > 0.82 ? 1 - (u - 0.82) / 0.18 * 0.5 : 1;
        frames.push({ transform: 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + sc.toFixed(2) + ') rotate(' + Math.round(u * 540) + 'deg)', opacity: s === 0 ? 0 : s === 12 ? 0.15 : 1 });
      }
      const a = c.animate(frames, { duration: dur, delay: k * gap, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'both' });
      a.onfinish = () => c.remove();
      a.oncancel = () => c.remove();
    }
    return dur + (n - 1) * gap;
  }
  function moneyFx(evs, idx, used) {
    const e = evs[idx];
    bfloat(e.p, (e.d > 0 ? '+' : '−') + fmt(Math.abs(e.d)), e.d > 0 ? 'plus' : 'minus');
    if (used.has(idx)) return;
    let partner = -1;
    if (e.d < 0) {
      for (let j = idx + 1; j < Math.min(evs.length, idx + 3); j++) {
        const f = evs[j];
        if (f.t === 'money' && f.d === -e.d && f.p !== e.p) { partner = f.p; used.add(j); break; }
      }
    }
    const amt = Math.abs(e.d);
    const n = Math.max(2, Math.min(8, Math.round(Math.log2(amt / 15 + 1)) + 1));
    let t = 0;
    if (partner >= 0) t = flyCoins(boardPt(e.p), boardPt(partner), n);
    else if (e.d > 0) t = flyCoins(boardPt('bank'), boardPt(e.p), n);
    else flyCoins(boardPt(e.p), boardPt('bank'), n);
    const dest = partner >= 0 ? partner : e.d > 0 ? e.p : -1;
    if (dest >= 0 && t) setTimeout(() => { const tok = $('#tok-' + dest); if (tok && !tok.classList.contains('hop')) pulse(tok, 'land', 560); }, t);

  const shown = el => { if (!el || !el.isConnected) return false; const r = el.getBoundingClientRect(); const cs = getComputedStyle(el); return r.width > 2 && r.height > 2 && cs.visibility !== 'hidden' && r.bottom > 0 && r.right > 0 && r.top < innerHeight && r.left < innerWidth; };

  // posisi akhir elemen setelah animasi masuk induknya (dialog/kotak intip) selesai
  function finalRect(el) {

  function flyCard(p, target, done) {
    const fin = flew => { if (target) { if (flew) target.classList.add('flown'); target.classList.remove('await'); } if (done) done(); };
    const from = !reduceMotion() && target ? flyFrom(p) : null;
    if (!from) { fin(); return; }
    target.classList.add('await');
    const a = from.getBoundingClientRect(), b = finalRect(target);
    const deck = $('#deck');
    if (deck && deck.contains(from)) { deck.classList.remove('lift'); void deck.offsetWidth; deck.classList.add('lift'); setTimeout(() => deck.classList.remove('lift'), 1300); }
    const fly = document.createElement('div');
    fly.className = 'fly-card';
    fly.setAttribute('aria-hidden', 'true');
    fly.innerHTML = '<span>' + ART.art('card') + '</span>';
    document.body.appendChild(fly);
    const box = (r, extra) => Object.assign({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' }, extra);
    const mid = { left: (a.left + b.left) / 2, top: Math.min(a.top, b.top) - Math.min(90, innerHeight * .12), width: (a.width + b.width) / 2, height: (a.height + b.height) / 2 };
    const anim = fly.animate([
      box(a, { transform: 'perspective(800px) rotateX(35deg) rotate(-8deg)', opacity: 0.4 }),
      box(a, { transform: 'perspective(800px) translateY(-30%) rotate(-4deg) scale(1.12)', opacity: 1, offset: 0.22 }),
      box(mid, { transform: 'perspective(800px) rotateY(-24deg) rotate(6deg)', opacity: 1, offset: 0.6 }),
      box(b, { transform: 'perspective(800px) none', opacity: 1 })
    ], { duration: Math.round(900 * Math.max(0.7, SPD())), easing: 'cubic-bezier(.45, .05, .3, 1)', fill: 'forwards' });

    anim.onfinish = end; anim.oncancel = end;
    setTimeout(end, 2500);

  function matchGame(host, ch, done) {
    const pool = ['kotatua', 'bali', 'paris', 'kyoto', 'santorini', 'hawaii', 'ferris', 'balloon', 'swiss', 'seoul'];
    const pickd = pool.slice().sort(() => Math.random() - 0.5).slice(0, ch.pairs);
    const cards = pickd.concat(pickd).sort(() => Math.random() - 0.5).map((k, i) => ({ k, i, open: false, done: false }));
    let first = null, lock = false, left = ch.seconds * 10, timer = null, matched = 0, el = host;
    const info = () => 'Sisa ' + Math.ceil(left / 10) + ' detik · ' + matched + '/' + ch.pairs + ' pasang';
    // grid dibuat sekali; buka/tutup hanya mengganti kelas supaya kartu berputar 3D (bukan digambar ulang)
    const build = () => {
      el.innerHTML = '<div class="timer-bar" aria-hidden="true"><i style="--v:' + Math.max(0, left / (ch.seconds * 10) * 100) + '%"></i></div><div class="tiny muted mg-info">' + info() + '</div>' +
        '<div class="match-grid">' + cards.map(c => '<button type="button" class="mcard" data-mc="' + c.i + '"><span class="mc-in" aria-hidden="true"><span class="mc-back">' + ic('heart') + '</span><span class="mc-face">' + ART.art(c.k) + '</span></span></button>').join('') + '</div>';
      $$('[data-mc]', el).forEach(b => b.addEventListener('click', () => flip(Number(b.dataset.mc))));
      draw();
    };
    const draw = () => {
      cards.forEach(c => {
        const b = el.querySelector('[data-mc="' + c.i + '"]');
        if (!b) return;
        b.classList.toggle('open', c.open);
        b.classList.toggle('done', c.done);
        b.setAttribute('aria-label', c.open || c.done ? TILES.find(t => t.art === c.k).name : 'Kartu tertutup');
      });
      const t = el.querySelector('.mg-info');
      if (t) t.textContent = info();
    };
    const flip = i => {
      const c = cards[i];
      if (lock || c.open || c.done) return;
      c.open = true; SND.play('click');
      if (!first) { first = c; draw(); return; }
      const a = first; first = null;
      if (a.k === c.k) { a.done = c.done = true; a.open = c.open = false; matched++; SND.play('coin'); draw(); if (matched === ch.pairs) { stop(); done(true, 'Semua kartu cocok dengan sisa ' + Math.ceil(left / 10) + ' detik!'); } return; }
      lock = true; draw();
      setTimeout(() => { a.open = c.open = false; lock = false; draw(); }, 650);
    };
    const stop = () => clearInterval(timer);
    timer = setInterval(() => { left--; if (left <= 0) { stop(); done(false, 'Waktu habis! ' + matched + ' dari ' + ch.pairs + ' pasang cocok.'); return; } const bar = el.querySelector('.timer-bar i'); if (bar) bar.style.setProperty('--v', (left / (ch.seconds * 10) * 100) + '%'); const t = el.querySelector('.mg-info'); if (t && left % 10 === 0) t.textContent = info(); }, 100);
    build();
    return { stop, reattach(h) { el = h; build(); } };
  }
  function heartbeatGame(host, ch, done) {
    let el = host, raf = 0, t0 = performance.now(), taps = [], speed = 1;
    const draw = () => {
      el.innerHTML = '<div class="beat-track"><div class="beat-zone"></div><div class="beat-heart" id="beatHeart">' + ic('heart') + '</div></div>' +
        '<div class="beat-dots">' + Array.from({ length: ch.taps }, (_, i) => '<i class="' + (taps[i] == null ? '' : taps[i] ? 'hit' : 'miss') + '"></i>').join('') + '</div>' +
        '<button type="button" class="btn go block" id="beatTap" data-focus>' + ic('heart') + '<span>Ketuk! (' + taps.length + '/' + ch.taps + ')</span></button><div class="tiny muted">Butuh ' + ch.need + ' ketukan tepat di zona merah muda. Bisa juga tekan spasi.</div>';
      el.querySelector('#beatTap').addEventListener('click', tap);
    };
    const pos = () => { const t = (performance.now() - t0) / 1000 * speed; const ph = t % 2; return ph < 1 ? ph : 2 - ph; };
    const loop = () => { const h = el.querySelector('#beatHeart'); if (h) h.style.left = (pos() * 100) + '%'; raf = requestAnimationFrame(loop); };
    const key = e => { if (e.code === 'Space') { e.preventDefault(); tap(); } };
    function tap() {
      const x = pos();
      const hit = x >= 0.41 && x <= 0.59;
      taps.push(hit); SND.play(hit ? 'heart' : 'error');
      speed += 0.18;
      draw();
      if (taps.length >= ch.taps) {
        stop();
        const hits = taps.filter(Boolean).length;
        done(hits >= ch.need, hits + ' dari ' + ch.taps + ' ketukan tepat. ' + (hits >= ch.need ? 'Detak kalian sinkron!' : 'Hampir sinkron. Coba lagi lain kali.'));
      }
    }
    function stop() { cancelAnimationFrame(raf); document.removeEventListener('keydown', key); }
    document.addEventListener('keydown', key);
    draw(); loop();
    return { stop, reattach(h) { el = h; draw(); } };
  }

  // ---------- pilih petak (festival, bangun, kartu aksi, World Tour) ----------
  function pTarget(key) {
    const S = App.S, it = head();
    if (!it || it.type !== 'TARGET') return;
    const p = it.p;
    const cand = new Set(E.targetCandidates(S, p, it.kind));
    const theirs = new Set(it.kind === 'swap' ? E.swapTargets(S, p) : []);
    const META = {
      festival: { title: 'Festival Cinta', art: 'festival', ok: 'Adakan Festival', skip: 'Lewati', hint: 'Ketuk kotamu yang menyala. Tolnya jadi ×2 (×3 kalau festival lagi di kota yang sama).' },
      build: { title: 'Bangun dari START', art: 'start', ok: 'Pilih Kota', skip: 'Lewati', hint: 'Ketuk kotamu yang mau dibangun.' },
      renov: { title: 'Renovasi Gratis', art: 'b2', ok: 'Renovasi', skip: 'Lewati', hint: 'Ketuk kotamu: naik 1 tingkat gratis.' },
      storm: { title: 'Badai Rindu', art: 'card', ok: 'Kirim Badai', skip: 'Lewati', hint: 'Ketuk kota lawan yang menyala: bangunannya turun 1 tingkat.' },
      swap: { title: 'Tukar Kota', art: 'card', ok: 'Tukar', skip: 'Lewati', hint: '' }
    }[it.kind];
    const def = {
      key, sel: [], art: META.art, title: META.title, skipLabel: META.skip,
      can: i => it.kind === 'swap' ? (def.sel.length === 0 ? cand.has(i) : (theirs.has(i) || i === def.sel[0])) : cand.has(i),
      tap: i => {
        if (it.kind === 'swap') {
          if (def.sel.length === 0) def.sel = [i];
          else if (i === def.sel[0]) def.sel = [];
          else def.sel = [def.sel[0], i];
        } else def.sel = [i];
      },
      ready: () => it.kind === 'swap' ? def.sel.length === 2 : def.sel.length === 1,
      hint: () => {
        if (it.kind === 'swap') return def.sel.length === 0 ? 'Langkah 1: ketuk kotamu yang mau diberikan.' : def.sel.length === 1 ? 'Langkah 2: ketuk kota lawan yang mau diambil (' + TILES[def.sel[0]].name + ' akan diberikan).' : TILES[def.sel[0]].name + ' ↔ ' + TILES[def.sel[1]].name;
        if (def.sel.length) {
          const t = TILES[def.sel[0]];
          if (it.kind === 'festival') return t.name + ': tol jadi ' + fmt(festPreview(S, def.sel[0])) + '.';
          if (it.kind === 'storm') return t.name + ' milik ' + pname(S.tiles[def.sel[0]].owner) + ' turun jadi ' + E.LEVEL_NAME[S.tiles[def.sel[0]].level - 1] + '.';
          if (it.kind === 'renov') return t.name + ' naik jadi ' + E.LEVEL_NAME[E.upgradeLevels(S, p, def.sel[0])[0]] + '.';
          return t.name + ' dipilih.';
        }
        return META.hint;
      },
      okLabel: () => META.ok,
      confirm: () => act(it.kind === 'swap' ? { type: 'TARGET_PICK', p, tile: def.sel[0], tile2: def.sel[1] } : { type: 'TARGET_PICK', p, tile: def.sel[0] }),
      skip: () => act({ type: 'TARGET_SKIP', p })
    };
    UI.startPick(def);
  }
  function festPreview(S, ti) {
    const mult = S.festival.tile === ti ? Math.min(RULES.festivalMax, S.festival.mult + 1) : 2;
    const r = E.rentInfo(S, ti);
    const base = r ? r.amount / (S.festival.tile === ti ? S.festival.mult : 1) : 0;
    return Math.round(base * mult / 5) * 5;
  }
  function pTour(key) {
    const S = App.S, it = head();
    if (!it || it.type !== 'TOUR') return;
    const p = it.p, P = S.players[p];
    const def = {
      key, sel: [], art: 'plane', title: 'World Tour', skipLabel: 'Lempar dadu biasa',
      can: i => i !== E.TRAVEL && i !== E.ISLAND && P.cash >= RULES.travelFee,
      tap: i => { def.sel = [i]; },
      ready: () => def.sel.length === 1,
      hint: () => {
        if (P.cash < RULES.travelFee) return 'Uangmu kurang untuk tiket ' + RULES.travelFee + '. Lempar dadu biasa.';
        if (!def.sel.length) return 'Ketuk petak tujuan mana pun. Tiket ' + RULES.travelFee + '. Lewat START tetap dapat gaji.';
        const t = TILES[def.sel[0]], st = S.tiles[def.sel[0]];
        let s = 'Terbang ke ' + t.name + '. ';
        if (t.price) s += st.owner < 0 ? 'Bisa dibeli (' + fmt(E.buyCost(S, p, t.i, 0)) + ').' : st.owner === p ? 'Kotamu: bisa dibangun.' : 'Milik ' + pname(st.owner) + ': tol ' + fmt(E.rentFor(S, t.i, p)) + '!';
        else s += t.desc || '';
        return s;
      },
      okLabel: () => def.sel.length ? 'Terbang · ' + RULES.travelFee : 'Pilih tujuan',
      confirm: () => act({ type: 'TOUR_GO', p, tile: def.sel[0] }),
      skip: () => act({ type: 'TOUR_SKIP', p })
    };
    UI.startPick(def);
  }

  // ---------- sinkronisasi keputusan dengan state ----------
  function syncModal(force) {
    const S = App.S;
    if (!S || S.over) return;
    const it = S.queue[0], a = E.actor(S);
    if (it && controls(a)) {
      const key = 'd' + S.seq;
      if (it.type === 'TARGET' || it.type === 'TOUR') {
        if (App.modal && App.modal.decision) closeModal(true);
        if (!force && App.pick && App.pick.key === key) return;
        if (App.tour) return;
        openDecision(it, key);
        return;
      }
      if (!force && App.modal && App.modal.key === key) return;
      if (!force && App.modal && App.modal.decision && App.modal.itype === it.type && it.type === 'DEBT') { App.modal.key = key; refreshModal(); return; }
      openDecision(it, key);
      return;
    }
    if (App.pick) UI.endPick();
    if (App.modal && App.modal.decision) closeModal();
    else if (App.modal) refreshModal();
  }

          if (t.type === 'travel') body += '<div class="kv"><span>Tiket terbang</span><b>' + RULES.travelFee + '</b></div>';
          if (t.type === 'island') body += '<div class="kv"><span>Biaya perahu</span><b>' + RULES.islandFee + '</b></div>';

        }

      },
      mount: m => { on(m, '#tdClose', () => closeModal()); }

  let confettiStop = null;
  function confetti(canvas) {
    if (UI.reduceMotion()) return () => {};
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(2, G.devicePixelRatio || 1);
    const resize = () => { canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; };
    resize();
    const cols = ['#FF4F8B', '#FFD93D', '#3DDBD9', '#B79CFF', '#FF9F43', '#7BCF5D'];
    const parts = Array.from({ length: 180 }, () => ({ x: Math.random() * canvas.width, y: -Math.random() * canvas.height * 0.8, vx: (Math.random() - 0.5) * 2 * dpr, vy: (2 + Math.random() * 3) * dpr, r: (5 + Math.random() * 7) * dpr, a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.2, c: cols[Math.floor(Math.random() * cols.length)], heart: Math.random() < 0.35 }));
    let raf = 0;
    const t0 = performance.now();
    const heart = (x, y, s) => { ctx.beginPath(); ctx.moveTo(x, y + s * 0.3); ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3); ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s); ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3); ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3); ctx.fill(); };
    const tick = now => {
      const el = (now - t0) / 1000;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      parts.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.a += p.va;
        if (p.y > canvas.height + 20 && el < 4.5) { p.y = -20; p.x = Math.random() * canvas.width; }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
        if (p.heart) heart(0, -p.r / 2, p.r * 1.4); else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        ctx.restore();
      });
      if (el < 9) raf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
    raf = requestAnimationFrame(tick);
    addEventListener('resize', resize);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', resize); };
  }

      '<div class="win-hero"><div class="eyebrow">' + (instant ? 'Menang instan' : 'Pemenang') + ' · ronde ' + o.round + '</div>' +
      '<div class="win-stage"><span class="rays" aria-hidden="true"></span><span class="win-merpi">' + ART.merpi('is-love') + '</span><div class="win-av">' + avatarHTML(w, 'xl') + '<span class="win-crown">' + ic('crown') + '</span></div></div>' +
      '<div class="win-name" id="winName">' + esc(w.name) + '</div><div class="win-title">' + esc(o.titles[o.winner] || 'Juragan Cinta') + '</div><div class="win-reason">' + esc(reason) + '</div>' +
      '<p class="win-msg" id="winMsg">“' + esc(msg) + '”</p>' +
      '<div class="field msg-edit"><label for="winMsgIn">Ubah pesan romantis</label><textarea class="input" id="winMsgIn" maxlength="240">' + esc(msg) + '</textarea></div></div>' +
      '<div class="panel"><h3>' + ic('trophy') + 'Peringkat</h3><div class="rank-list">' + rows + '</div></div>' +
      '<div class="panel"><h3>' + ic('level') + 'Statistik</h3><div class="stats-wrap"><table class="stats"><thead><tr><th>Pemain</th><th>Kota</th><th>Landmark</th><th>Tol masuk</th><th>Ambil alih</th><th>Tantangan</th><th>Love</th></tr></thead><tbody>' + statRows + '</tbody></table></div></div>' +
      '<div class="panel stack"><h3>' + ic('sparkle') + 'Achievement</h3>' + ach + '</div>' +
      '<div class="panel stack"><h3>' + ic('letter') + 'Surat cinta selama permainan</h3>' + letters + '</div>' +
      '<div class="setup-foot"><button type="button" class="btn ghost" id="wBoard">' + ic('map') + '<span>Lihat Papan</span></button>' + (App.mode === 'online' && !Net.isHost() ? '' : '<button type="button" class="btn soft" id="wAgain">' + ic('refresh') + '<span>Main Lagi</span></button>') + '<button type="button" class="btn primary" id="wHome">' + ic('home') + '<span>Menu Utama</span></button></div>' +
      '</div>';
    root.appendChild(el);
    SND.play('win');
    confettiStop = confetti($('#confetti'));
    const inp = $('#winMsgIn');
    inp.addEventListener('input', () => { winMsgOverride = inp.value.trim() || null; $('#winMsg').textContent = '“' + (inp.value.trim() || msg) + '”'; });
    $('#wBoard').onclick = () => { if (confettiStop) confettiStop(); el.remove(); };
    $('#wHome').onclick = () => { if (confettiStop) confettiStop(); winMsgOverride = null; exitToHome(); };
    const again = $('#wAgain');
    if (again) again.onclick = () => {
      if (confettiStop) confettiStop();
      winMsgOverride = null;
      if (App.mode === 'online') { Net.startGame(); return; }
      const ns = E.create({ players: S.players.map(p => ({ name: p.name, avatar: p.avatar, color: p.color, kind: p.kind, ai: p.ai })), settings: S.settings });
      enterGame('local', -1, ns);
    };
    setTimeout(() => { const b = $('#wHome'); if (b) b.focus({ preventScroll: true }); }, 60);
  }

  // ---------- tur singkat di game pertama ----------
  function tourSteps(S) {
    const st = S.settings, steps = [];
    steps.push({ sel: '#centerActions', title: 'Mulai dari sini', text: st.diceControl ? 'Pilih bidikan dadu (opsional), lalu tekan Lempar. Dadu kembar = lempar lagi!' : 'Tekan Lempar untuk berjalan. Dadu kembar = lempar lagi!' });
    steps.push({ sel: '#boardVP', title: 'Beli kota, bangun, tarik tol', text: 'Mendarat di kota kosong: beli tanah + villa/gedung/hotel sekaligus. Ketuk petak mana pun untuk melihat detailnya.' });
    if (st.instantWin) steps.push({ sel: '#game .pcard', title: 'Menang lebih cepat', text: 'Kuasai 3 grup warna, satu jalur penuh, atau 5 tempat wisata. Petak berdenyut = ada yang hampir menang!' });
    steps.push({ sel: '#hMenu', title: 'Menu & panduan', text: 'Buku Panduan bergambar, riwayat, dan pengaturan ada di sini.' });
    return steps;
  }
  let tourPlace = null;
  function endTour(done) {
    const ov = $('#tourOv');
    if (ov) ov.remove();
    if (tourPlace) { removeEventListener('resize', tourPlace); tourPlace = null; }
    if (done) store.set(KEYS.tour, 'done');
    if (!App.tour) return;
    App.tour = false;
    if (App.S) { UI.syncModal(); UI.renderStage(); UI.scheduleAI(); UI.scheduleAutoEnd(); }
  }
  function startTour() {
    const S = App.S;
    if (!S || S.over || $('#scrGame').hidden || store.get(KEYS.tour, null) === 'done' || $('#tourOv') || $('#winOv') || $('#guideOv')) return;
    const steps = tourSteps(S).filter(s => $(s.sel));
    if (!steps.length) return;
    let k = 0;
    App.tour = true;
    clearTimeout(App.aiTimer);
    UI.cancelAutoEnd();
    const ov = document.createElement('div');
    ov.className = 'tour'; ov.id = 'tourOv';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'tourT');
    ov.innerHTML = '<div class="tour-ring"></div><div class="tour-card"><span class="tour-merpi">' + ART.merpi('is-happy') + '</span><div class="tour-step"></div><b id="tourT"></b><p id="tourP"></p><div class="tour-foot"><button type="button" class="btn ghost sm" id="tSkip"><span>Lewati</span></button><span class="grow"></span><button type="button" class="btn primary sm" id="tNext"></button></div></div>';
    document.body.appendChild(ov);
    const ring = $('.tour-ring', ov), card = $('.tour-card', ov);
    tourPlace = () => {
      const el = $(steps[k].sel);
      const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0, right: innerWidth / 2, bottom: innerHeight / 2 };
      const pad = 8, top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
      const h = Math.min(innerHeight - 8, r.bottom + pad) - top, w = Math.min(innerWidth - 8, r.right + pad) - left;
      Object.assign(ring.style, { top: top + 'px', left: left + 'px', width: Math.max(0, w) + 'px', height: Math.max(0, h) + 'px' });
      const cw = Math.min(340, innerWidth - 32);
      card.style.width = cw + 'px';
      const ch = card.offsetHeight;
      let ct = top + h + 14;
      if (ct + ch > innerHeight - 12) ct = top - ch - 14;
      if (ct < 12) ct = Math.max(12, Math.min(innerHeight - ch - 12, top + h / 2 - ch / 2));
      const cl = Math.max(16, Math.min(innerWidth - cw - 16, left + w / 2 - cw / 2));
      card.style.top = ct + 'px'; card.style.left = cl + 'px';
    };
    const showStep = () => {
      const st = steps[k];
      $('.tour-step', ov).textContent = 'Tur singkat · ' + (k + 1) + '/' + steps.length;
      $('#tourT', ov).textContent = st.title;
      $('#tourP', ov).textContent = st.text;
      $('#tNext', ov).innerHTML = '<span>' + (k === steps.length - 1 ? 'Mulai main!' : 'Lanjut') + '</span>';
      card.classList.remove('in'); void card.offsetWidth; card.classList.add('in');
      requestAnimationFrame(tourPlace);
    };
    $('#tNext', ov).onclick = () => { SND.play('click'); if (++k >= steps.length) endTour(true); else showStep(); };
    $('#tSkip', ov).onclick = () => endTour(true);
    addEventListener('resize', tourPlace);
    showStep();
    setTimeout(() => { const b = $('#tNext', ov); if (b) b.focus({ preventScroll: true }); }, 80);
  }

  // ---------- setelah state stabil ----------
  function afterSettle() {
    const S = App.S;
    if (!S) return;
    renderPause();
    if (S.over) { UI.renderStage(); if (App.modal && App.modal.decision) UI.closeModal(true); UI.endPick(true); showWin(); return; }
    if (!App.tour) UI.syncModal();
    UI.renderStage();
    UI.scheduleAI();
    UI.scheduleAutoEnd();
  }
  function onLetter(p) {
    const S = App.S;
    if (!S) return;
    const l = S.letters.slice().reverse().find(x => x.p === p);
    if (!l) return;
    if (UI.controls(p) && App.mode === 'online') { toast('Pesanmu terkirim dan tersimpan sampai akhir permainan.', { icon: 'letter', kind: 'good' }); return; }
    toast(l.text, { title: 'Surat cinta dari ' + S.players[p].name, icon: 'letter', kind: 'love', ms: 6500 });
  }

  // ---------- boot ----------
  function bindHeader() {
    $('#hSound').onclick = () => { App.prefs.sound = !App.prefs.sound; SND.setEnabled(App.prefs.sound); if (App.prefs.sound) SND.play('click'); savePrefs(); syncSoundBtn(); };
    $('#hGuide').onclick = () => UI.openGuide();
    $('#hSettings').onclick = UI.openSettings;
    $('#hMenu').onclick = () => UI.openMenu();
    $('#brandHome').onclick = e => { e.preventDefault(); if (App.S && !$('#scrGame').hidden) UI.openExit(); else { show('scrHome'); renderHome(); } };
    $('#hMenu').innerHTML = ic('menu'); $('#hGuide').innerHTML = ic('book'); $('#hSettings').innerHTML = ic('sliders');
    $('.brand-mark').innerHTML = ART.merpi('');
  }
  function boot() {
    document.documentElement.lang = 'id';
    // tata letak papan memakai container query (iOS 16+, Chrome/Edge 105+, Firefox 110+)
    const modern = !!(G.CSS && CSS.supports && CSS.supports('container-type: inline-size'));
    if (!modern) setTimeout(() => toast('Browser kamu terlalu lama untuk Loveopoly. Perbarui iOS / Chrome agar papan tampil rapi.', { kind: 'err', title: 'Perbarui browser', ms: 9000 }), 600);
    if (!$('#iconSprite')) { const d = document.createElement('div'); d.id = 'iconSprite'; d.innerHTML = G.LoveIcons.sprite(); document.body.prepend(d); }
    applyTheme();
    SND.setEnabled(App.prefs.sound);
    syncSoundBtn();
    bindHeader();
    document.addEventListener('pointerdown', () => SND.unlock(), { once: true });
    show('scrHome');
    renderHome();
  }

  Object.assign(UI, { show, savePrefs, applyTheme, syncSoundBtn, renderHome, openSetup, openOnline, renderLobby, enterGame, exitToHome, togglePause, showWin, afterSettle, onLetter, boot, startTour, endTour });

  const start = () => { try { boot(); } catch (e) { console.error(e); const m = document.getElementById('fatal'); if (m) { m.hidden = false; m.textContent = 'Terjadi kesalahan saat memuat game: ' + e.message; } } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body></html>
