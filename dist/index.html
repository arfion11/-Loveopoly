/* ---------- dasar ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--fb); min-height: 100dvh; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
body.in-game { overflow: hidden; height: 100dvh; }
button { font: inherit; color: inherit; }
button:not(:disabled) { cursor: pointer; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3, h4 { font-family: var(--fd); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
.ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.18em; }
.muted { color: var(--ink-3); }
.tiny { font-size: 12.5px; line-height: 1.45; }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .08em; }
.num { font-variant-numeric: tabular-nums; }
.grow { flex: 1 1 auto; min-width: 0; }
svg.art { display: block; width: 100%; height: 100%; overflow: visible; }
.coin-ic { display: inline-block; width: .95em; height: .95em; border-radius: 50%; flex: none; vertical-align: -0.12em; background: radial-gradient(circle at 35% 30%, #FFF1B0 0 18%, transparent 19%), radial-gradient(circle, #FFD54A 0 55%, #F2B416 56% 100%); box-shadow: inset 0 0 0 1.5px #C98D06; }
.page-sky { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(70% 60% at 0% 0%, color-mix(in srgb, var(--brand-soft) 85%, transparent), transparent 70%), radial-gradient(65% 55% at 100% 100%, color-mix(in srgb, var(--bg-2) 95%, transparent), transparent 72%), var(--bg); }
/* Merpi besar di tengah papan (saat panel aksi ada di luar papan: kamera 3D & ponsel), berdiri di atas alas globe */
.mascot { --mw: 34cqmin; display: none; position: absolute; left: 50%; top: 46%; width: var(--mw); aspect-ratio: 1; translate: -50% -50%; pointer-events: none; }
.game.v3d .mascot, .game.layout-compact .mascot, .game.layout-land .mascot { display: block; }
.game.v3d .center .cd-map, .game.layout-compact .center .cd-map, .game.layout-land .center .cd-map { opacity: 0; }

/* ---------- header ---------- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: var(--hdr); display: flex; align-items: center; gap: 12px; padding: 0 max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 41; background: var(--surface); }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 40px; height: 40px; flex: none; display: grid; place-items: center; }
.brand-mark .merpi { width: 40px; height: 40px; }
.brand-name { font: 700 22px/1 var(--fd); color: var(--brand); letter-spacing: -.01em; }
.hdr-mid { flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; min-width: 0; container-type: inline-size; }
.hdr-net:empty { display: none; }
.hdr-mid .cam-ctl { position: static; display: flex; align-items: center; gap: 6px; }
.hdr-mid .round-chip.vp { padding: 6px 10px; font-size: 13.5px; white-space: nowrap; box-shadow: inset 0 0 0 2px var(--line); }
.hdr-mid.net-on .rc-w { display: none; }
.hdr-mid .net-chip { min-width: 0; overflow: hidden; }
.hdr-mid .cam-btn { min-height: 38px; padding: 0 11px; box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--line); }
body:not(.in-game) #camCtl { display: none !important; }
@container (max-width: 250px) { .hdr-mid .cam-btn span { display: none; } .hdr-mid .cam-btn { width: 44px; min-height: 44px; padding: 0; justify-content: center; } }
@container (max-width: 190px) { .hdr-mid .rc-w { display: none; } }
@container (max-width: 240px) { .net-chip .host-tag { display: none; } }
.hdr-right { display: flex; gap: 6px; }
.icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; border: 0; background: var(--surface); color: var(--ink-2); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--line); transition: transform .1s, box-shadow .1s; flex: none; }
.icon-btn .ic { width: 21px; height: 21px; }
button, a, input, textarea, .tile, [role="button"] { touch-action: manipulation; }
.icon-btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--line), 0 1px 0 var(--line); }
.icon-btn.accent { background: var(--brand); color: #fff; box-shadow: inset 0 0 0 2px var(--brand-d), 0 3px 0 var(--brand-d); }
.icon-btn[aria-pressed="false"] { color: var(--ink-3); }

/* ---------- tombol 3D ---------- */
.btn { --b: var(--surface); --bd: var(--line-2); --fg: var(--ink); position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border: 0; border-radius: 15px; background: var(--b); color: var(--fg); font: 600 16px/1.1 var(--fd); letter-spacing: .005em; box-shadow: inset 0 0 0 2px var(--bd), 0 4px 0 var(--bd); transition: transform .1s, box-shadow .1s, filter .15s; text-align: center; white-space: nowrap; -webkit-user-select: none; user-select: none; }
.btn .ic { width: 20px; height: 20px; }
.btn:hover:not(:disabled) { filter: brightness(1.04); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 0 0 2px var(--bd), 0 1px 0 var(--bd); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { --b: linear-gradient(180deg, var(--brand-2), var(--brand)); --bd: var(--brand-d); --fg: #fff; text-shadow: 0 1px 0 rgba(150, 20, 70, .35); }
.btn.lilac { --b: linear-gradient(180deg, var(--violet-2), var(--violet)); --bd: var(--violet-d); --fg: #fff; }
.btn.soft { --b: var(--surface-3); --bd: var(--line-2); --fg: var(--ink); }
.btn.soft.lilac { --b: var(--violet-soft); --bd: var(--violet-2); --fg: var(--violet-d); text-shadow: none; }
.btn.soft.rose { --b: var(--brand-soft); --bd: var(--brand-2); --fg: var(--brand-ink); }
.btn.ghost { --b: transparent; --bd: transparent; --fg: var(--ink-2); box-shadow: none; }
.btn.ghost:active:not(:disabled) { box-shadow: none; }
.btn.danger { --b: linear-gradient(180deg, #FF7B7F, var(--danger)); --bd: var(--danger-d); --fg: #fff; }
.btn.big { min-height: 52px; font-size: 17px; padding: 0 22px; border-radius: 17px; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn.go { --b: linear-gradient(180deg, #FFE27A, #FFC93C 55%, #FFB21E); --bd: #D08A00; --fg: #5A3500; min-height: 58px; padding: 0 28px; font-size: 21px; font-weight: 700; border-radius: 20px; text-shadow: 0 1px 0 rgba(255, 255, 255, .6); box-shadow: inset 0 0 0 2.5px var(--bd), 0 5px 0 var(--bd), 0 10px 22px rgba(221, 158, 12, .35); }
.btn.go .ic { width: 24px; height: 24px; }
.btn.go:active:not(:disabled) { box-shadow: inset 0 0 0 2.5px var(--bd), 0 1px 0 var(--bd), 0 4px 10px rgba(221, 158, 12, .3); transform: translateY(4px); }
.btn.go:not(:disabled)::after { content: ""; position: absolute; inset: 4px 14px auto; height: 38%; border-radius: 14px 14px 30px 30px; background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0)); pointer-events: none; }
.btn.attn:not(:disabled), .btn.go:not(:disabled) { animation: breathe 2.2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.03); } }
.btn.go:active:not(:disabled), .btn.attn:active:not(:disabled) { animation: none; }
.btn.auto::before { content: ""; position: absolute; left: 10px; right: 10px; bottom: 6px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .85); transform-origin: left; animation: autobar var(--auto, 2400ms) linear forwards; }
@keyframes autobar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.btn.choice { justify-content: flex-start; width: 100%; white-space: normal; text-align: left; min-height: 50px; padding: 10px 16px; line-height: 1.3; font-weight: 500; font-family: var(--fb); font-size: 15px; }
.btn.choice.danger { --b: var(--danger-soft); --bd: var(--danger); --fg: var(--danger-d); }
.btn.tile-btn { flex-direction: column; gap: 6px; min-height: 84px; padding: 10px; white-space: normal; font-size: 14px; }
.btn.tile-btn .ic { width: 26px; height: 26px; color: var(--brand); }
.link-btn { border: 0; background: none; color: var(--brand-ink); font: 700 13px var(--fd); padding: 4px 6px; border-radius: 8px; }

/* chip & tag */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-ink); font: 600 12.5px/1.2 var(--fd); white-space: nowrap; }
.chip .ic { width: 15px; height: 15px; }
.chip.gold { background: var(--gold-soft); color: var(--gold-ink); }
.chip.rose { background: var(--brand-soft); color: var(--brand-ink); }
.chip.lilac { background: var(--violet-soft); color: var(--violet-d); }
.chip.plain { background: var(--surface-3); color: var(--ink-2); }
.chip.mint { background: var(--mint-soft); color: var(--mint-d); }
:root[data-theme="dark"] .chip.lilac { color: var(--violet-2); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font: 600 11.5px/1.4 var(--fd); background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.tag .ic { width: 13px; height: 13px; }
.tag.warn { background: var(--danger-soft); color: var(--danger-d); }
.tag.sea, .tag.sky { background: var(--sky-soft); color: var(--sky-d); }
.tag.good { background: var(--mint-soft); color: var(--mint-d); }
.tag.lilac { background: var(--violet-soft); color: var(--violet-d); }
.online-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); margin-left: 6px; vertical-align: middle; }
.online-dot.on { background: var(--mint); box-shadow: 0 0 0 3px var(--mint-soft); }
.online-dot.afk { background: var(--gold); }

/* avatar */
.av { --s: 44px; position: relative; width: var(--s); height: var(--s); flex: none; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, color-mix(in srgb, var(--c) 22%, #fff)); box-shadow: inset 0 0 0 3px var(--c), 0 3px 0 color-mix(in srgb, var(--c) 70%, #000); font-size: calc(var(--s) * .55); line-height: 1; }
.av > span { transform: translateY(1px); }
.av.xs { --s: 24px; box-shadow: inset 0 0 0 2px var(--c); }
.av.sm { --s: 34px; }
.av.lg { --s: 56px; }
.av.xl { --s: 96px; box-shadow: inset 0 0 0 5px var(--c), 0 6px 0 color-mix(in srgb, var(--c) 70%, #000); }

/* form */
.field { display: grid; gap: 6px; }
.field label, .label { font: 600 13px var(--fd); color: var(--ink-2); }
.input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line-2); background: var(--surface); color: var(--ink); font: 600 16px var(--fb); transition: border-color .15s, box-shadow .15s; }
.input:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 4px var(--violet-soft); }
.input.invalid { border-color: var(--danger); }
textarea.input { min-height: 84px; resize: vertical; font-weight: 500; line-height: 1.45; }
.err { color: var(--danger-d); font-size: 12.5px; font-weight: 700; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 15px; background: var(--surface-3); box-shadow: inset 0 0 0 2px var(--line); }
.seg button { border: 0; background: transparent; padding: 8px 12px; border-radius: 11px; font: 600 14px var(--fd); color: var(--ink-2); min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand-ink); box-shadow: 0 2px 0 var(--line-2), inset 0 0 0 2px var(--brand-2); }
.switch { position: relative; width: 54px; height: 32px; flex: none; border: 0; border-radius: 999px; background: var(--line-2); transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
.switch[aria-checked="true"] { background: var(--mint); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 14px; border-radius: 16px; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--line); }
.toggle-row b { font: 600 15px var(--fd); }
.opt-list { display: grid; gap: 14px; }
.opt { display: grid; gap: 8px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 14px; background: var(--sky-soft); color: var(--ink); font-size: 14px; line-height: 1.45; }
.note > .ic { color: var(--sky-d); margin-top: 1px; width: 18px; height: 18px; flex: none; }
.note > span { min-width: 0; overflow-wrap: anywhere; }
.note-steps { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 3px; }
.note.warn { background: var(--danger-soft); }
.note.warn > .ic { color: var(--danger-d); }
.note.good { background: var(--mint-soft); }
.note.good > .ic { color: var(--mint-d); }
.note.gold { background: var(--gold-soft); }
.note.gold > .ic { color: var(--gold-d); }
.note.page { max-width: 1040px; margin: 0 auto 14px; }
.meter { position: relative; display: block; height: 10px; border-radius: 99px; background: var(--surface-3); box-shadow: inset 0 0 0 1.5px var(--line); overflow: hidden; flex: 1; }
.meter i { position: absolute; inset: 0 auto 0 0; width: var(--v, 0%); border-radius: 99px; background: linear-gradient(90deg, var(--brand-2), var(--brand)); transition: width .8s cubic-bezier(.3, .9, .3, 1); }
.meter.gold i { background: linear-gradient(90deg, var(--gold-2), var(--gold)); }
.empty { display: grid; place-items: center; gap: 8px; padding: 22px; text-align: center; color: var(--ink-3); border-radius: 18px; background: var(--surface-2); font-size: 14px; }
.empty .ic { width: 30px; height: 30px; }
.empty.big { max-width: 440px; margin: 60px auto; background: var(--surface); box-shadow: var(--shadow); }
.spinner { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--brand-soft); border-top-color: var(--brand); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.panel { background: var(--surface); border-radius: 24px; padding: 20px; box-shadow: var(--shadow), inset 0 0 0 2px var(--line); min-width: 0; }
.panel h3 { display: flex; align-items: center; gap: 8px; font-size: 19px; margin-bottom: 14px; }
.panel h3 .ic { color: var(--brand); width: 22px; height: 22px; }
.panel.stack { display: grid; gap: 12px; align-content: start; }
.panel.stack h3 { margin-bottom: 0; }
.form-sec { display: grid; gap: 12px; align-content: start; min-width: 0; }
.form-sec + .form-sec { border-top: 2px dashed var(--line); padding-top: 18px; margin-top: 6px; }
.form-sec .btn { width: 100%; }
.code-in::placeholder { letter-spacing: .02em; text-transform: none; font-family: var(--fb); font-size: 16px; }

/* ---------- layar ---------- */
main { position: relative; }
.screen { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); }
.screen#scrGame { padding: 0; }

/* beranda */
.home { max-width: 1140px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr 1fr; gap: 36px; align-items: center; min-height: calc(100dvh - var(--hdr) - 60px); }
.home-copy { position: relative; z-index: 1; display: grid; gap: 18px; min-width: 0; order: 1; }
.home-art { order: 2; min-width: 0; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; width: fit-content; padding: 6px 14px; border-radius: 999px; background: var(--surface); color: var(--brand-ink); font: 600 13px var(--fd); box-shadow: inset 0 0 0 2px var(--brand-soft); }
.eyebrow .ic { color: var(--brand); }
.home-title { font: 700 clamp(54px, 9vw, 96px)/.95 var(--fd); color: var(--brand); letter-spacing: -.025em; }
.ht-word { display: inline-flex; filter: drop-shadow(0 6px 0 var(--brand-d)); }
.ht-word span { display: inline-block; animation: letterHop 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * .09s); }
@keyframes letterHop { 0%, 70%, 100% { transform: translateY(0); } 78% { transform: translateY(-10px) rotate(-3deg); } 86% { transform: translateY(2px); } }
.home-sub { font-size: 17px; color: var(--ink-2); max-width: 54ch; line-height: 1.55; text-shadow: 0 0 2px var(--bg), 0 0 8px var(--bg), 0 0 16px var(--bg); }
.home-copy .tiny, .setup-head h2, .setup-head .btn.ghost { text-shadow: 0 0 2px var(--bg), 0 0 8px var(--bg), 0 0 14px var(--bg); }
.home-actions { display: grid; gap: 12px; }
.mode-card { --mc: var(--brand-2); --mcd: var(--brand-d); --mct: var(--brand-soft); display: flex; align-items: center; gap: 16px; width: 100%; padding: 12px 18px 12px 12px; border: 0; border-radius: 22px; background: var(--surface); color: var(--ink); text-align: left; box-shadow: inset 0 0 0 2px var(--line), 0 5px 0 var(--line-2), var(--shadow); transition: transform .22s cubic-bezier(.3, 1.5, .5, 1), box-shadow .18s ease, background-color .18s ease; }
.mode-card.mc-local { --mc: var(--gold); --mcd: var(--gold-d); --mct: var(--gold-soft); }
.mode-card.mc-online { --mc: var(--sky); --mcd: var(--sky-d); --mct: var(--sky-soft); }
.mode-card .mc-art { width: 68px; height: 68px; flex: none; padding: 8px; border-radius: 18px; background: var(--mct); --oc: var(--brand); transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
.mode-card .mc-txt { display: grid; gap: 2px; flex: 1; min-width: 0; }
.mode-card b { font: 600 20px var(--fd); }
.mode-card .mc-txt span { color: var(--ink-2); font-size: 14px; }
.mode-card > .ic { color: var(--ink-3); width: 24px; height: 24px; transition: transform .22s cubic-bezier(.3, 1.5, .5, 1), color .18s; }
/* sorotan hanya saat diarahkan pointer / fokus keyboard / ditekan: tidak ada kartu yang tampak terpilih sejak awal */
.mode-card:focus-visible { outline: none; box-shadow: inset 0 0 0 2.5px var(--mc), 0 7px 0 var(--mcd), 0 0 0 5px color-mix(in srgb, var(--mc) 35%, transparent), var(--shadow); transform: translateY(-3px); }
.mode-card:active { transform: translateY(3px); box-shadow: inset 0 0 0 2.5px var(--mc), 0 1px 0 var(--mcd); transition-duration: .08s; }
@media (hover: hover) {
  .mode-card:hover { transform: translateY(-4px); box-shadow: inset 0 0 0 2.5px var(--mc), 0 8px 0 var(--mcd), var(--shadow-lg); }
  .mode-card:hover:active { transform: translateY(3px); box-shadow: inset 0 0 0 2.5px var(--mc), 0 1px 0 var(--mcd); }
  .mode-card:hover .mc-art { transform: scale(1.08) rotate(-4deg); }
  .mode-card:hover .mc-art svg { animation: mcHop 1s cubic-bezier(.3, .7, .4, 1) infinite; }
  .mode-card.mc-local:hover .mc-art svg { animation-name: mcSway; }
  .mode-card.mc-online:hover .mc-art svg { animation-name: mcFly; }
  .mode-card:hover > .ic { transform: translateX(5px); color: var(--mcd); }
}
.mode-card:focus-visible .mc-art { transform: scale(1.08) rotate(-4deg); }
.mode-card:focus-visible > .ic { transform: translateX(5px); color: var(--mcd); }
@keyframes mcHop { 0%, 100% { transform: none; } 40% { transform: translateY(-9%) rotate(4deg); } 60% { transform: translateY(2%) scale(1.04, .96); } }
@keyframes mcSway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-4%); } }
/* kartu utama Online: lebih besar, latar langit, label & tombol "Mulai"; pesawat melayang terus */
.mode-card.mc-hero { position: relative; gap: 20px; padding: 22px 22px 22px 18px; border-radius: 26px; background: linear-gradient(135deg, color-mix(in srgb, var(--sky) 22%, var(--surface)), var(--surface) 70%); box-shadow: inset 0 0 0 3px var(--sky), 0 6px 0 var(--sky-d), var(--shadow-lg); }
.mode-card.mc-hero .mc-art { width: 96px; height: 96px; padding: 10px; border-radius: 24px; background: var(--sky-soft); }
.mode-card.mc-hero .mc-art svg { animation: mcFly 3.2s ease-in-out infinite; }
.mode-card.mc-hero b { font-size: 26px; }
.mode-card.mc-hero .mc-txt > span { font-size: 15px; }
.mc-badge { position: absolute; top: -12px; left: 22px; display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 99px; background: var(--surface); color: var(--sky-ink); font: 700 12px var(--fd); letter-spacing: .02em; box-shadow: inset 0 0 0 2px var(--sky); }
.mc-badge .ic { width: 13px; height: 13px; fill: currentColor; }
.mc-go { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 10px 14px 10px 18px; border-radius: 99px; background: #1B63A6; color: #fff; font: 700 15px var(--fd); box-shadow: 0 3px 0 #0F3F6E; transition: transform .22s cubic-bezier(.3, 1.5, .5, 1); }
.mc-go .ic { width: 18px; height: 18px; }
@media (hover: hover) and (pointer: fine) { .mode-card.mc-hero:hover .mc-go { transform: translateX(4px); } }
/* dua mode lain: berdampingan & ringkas */
.mc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-card.mc-sm { gap: 10px; padding: 10px 12px 10px 10px; border-radius: 20px; }
.mode-card.mc-sm .mc-art { width: 48px; height: 48px; padding: 6px; border-radius: 14px; }
.mode-card.mc-sm b { font-size: 17px; }
.mode-card.mc-sm .mc-txt > span { font-size: 12.5px; line-height: 1.3; }
.mode-card.mc-sm > .ic { width: 18px; height: 18px; }
@media (max-width: 340px) { .mc-row { grid-template-columns: 1fr; } }
@keyframes mcFly { 0% { transform: rotate(0); } 50% { transform: rotate(-10deg) translate(4%, -6%); } 100% { transform: rotate(0); } }
.home-secondary { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.resume-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--mint), 0 4px 0 var(--mint-d); }

.hero-scene { --ez: cubic-bezier(.2, .8, .3, 1); position: relative; aspect-ratio: 1; max-width: 520px; margin: 0 auto; container-type: inline-size; }
.hero-scene .hero-hearts { position: absolute; inset: 0; pointer-events: none; }
/* desktop: hero miring 3D mengikuti pointer; lapisan bergeser beda jarak (awan paling dekat, cincin kota paling jauh) */
@media (hover: hover) and (pointer: fine) {
  .hero-scene { transform: perspective(1100px) rotateX(calc(var(--py, 0) * -8deg)) rotateY(calc(var(--px, 0) * 10deg)); transition: transform .8s var(--ez); }
  .hero-scene .cloud { translate: calc(var(--px, 0) * 28px) calc(var(--py, 0) * 16px); transition: translate .8s var(--ez); }
  .hero-scene .hero-ring { translate: calc(var(--px, 0) * -10px) calc(var(--py, 0) * -8px); transition: translate .8s var(--ez); }
  .hero-scene .hero-merpi { translate: calc(var(--px, 0) * 16px) calc(var(--py, 0) * 12px); transition: translate .8s var(--ez); }
  .hero-scene .hero-hearts { translate: calc(var(--px, 0) * 22px) calc(var(--py, 0) * 16px); transition: translate .8s var(--ez); }
}
.hero-ring { position: absolute; inset: 6%; border-radius: 50%; background: radial-gradient(circle, var(--surface) 0 42%, var(--surface-3) 43% 60%, transparent 61%); animation: ring 60s linear infinite; }
.hr-tile { position: absolute; left: 50%; top: 50%; width: 17.5cqi; height: 17.5cqi; margin: -8.75cqi 0 0 -8.75cqi; padding: 3cqi; border-radius: 22%; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line), 0 5px 0 var(--line-2), var(--shadow); transform: rotate(calc(var(--k) * 45deg)) translateY(-34.5cqi) rotate(calc(var(--k) * -45deg)); }
.hr-tile svg { animation: ring 60s linear infinite reverse; }
@keyframes ring { to { transform: rotate(360deg); } }
.hero-merpi { position: absolute; left: 50%; top: 50%; width: 42%; aspect-ratio: 1; transform: translate(-50%, -54%); animation: hover 3.2s ease-in-out infinite; }
.hero-merpi .merpi { width: 100%; height: 100%; }
.hero-letter { position: absolute; width: 34%; right: -12%; top: 4%; transform: rotate(14deg); animation: letter 3.2s ease-in-out infinite; }
@keyframes hover { 0%, 100% { transform: translate(-50%, -54%); } 50% { transform: translate(-50%, -60%); } }
@keyframes letter { 0%, 100% { transform: rotate(14deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-8px); } }
.cloud { position: absolute; height: 12%; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow); opacity: .9; }
.cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
.cloud::before { width: 46%; aspect-ratio: 1; left: 14%; bottom: 30%; }
.cloud::after { width: 32%; aspect-ratio: 1; left: 50%; bottom: 40%; }
.cloud.c1 { width: 30%; left: -4%; top: 12%; animation: float 9s ease-in-out infinite; }
.cloud.c2 { width: 24%; right: -2%; top: 70%; animation: float 11s ease-in-out infinite reverse; }
.cloud.c3 { width: 18%; left: 8%; bottom: 4%; animation: float 13s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(18px); } }
.hero-hearts i { position: absolute; width: 18px; height: 18px; bottom: 30%; left: 50%; background: var(--brand); clip-path: path('M9 16.5C4 13 1 10 1 6.5A4 4 0 0 1 9 4.6 4 4 0 0 1 17 6.5C17 10 14 13 9 16.5Z'); opacity: 0; animation: heartUp 4s ease-in infinite; }
.hero-hearts i:nth-child(2) { left: 34%; animation-delay: .8s; background: var(--violet-2); }
.hero-hearts i:nth-child(3) { left: 64%; animation-delay: 1.6s; background: var(--gold); }
.hero-hearts i:nth-child(4) { left: 42%; animation-delay: 2.4s; }
.hero-hearts i:nth-child(5) { left: 58%; animation-delay: 3.2s; background: var(--mint); }
@keyframes heartUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-180px) scale(1.1) rotate(16deg); opacity: 0; } }

/* setup & online */
.setup { max-width: 1120px; margin: 0 auto; display: grid; gap: 16px; }
.setup-head { display: flex; align-items: center; gap: 12px; max-width: 1120px; margin: 0 auto 4px; width: 100%; }

.sc-head { display: flex; align-items: center; gap: 12px; }

.setup-foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding-top: 6px; }
.online { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel.wide { grid-column: 1 / -1; }
.code-box { font: 700 40px/1 var(--fd); letter-spacing: .22em; text-align: center; padding: 16px; border-radius: 18px; background: var(--brand-soft); color: var(--brand-ink); -webkit-user-select: all; user-select: all; }
.code-in { text-transform: uppercase; letter-spacing: .22em; font-size: 20px; }
.seat-chip { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-radius: 16px; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--line), inset 5px 0 0 var(--c); }

/* ---------- tata letak permainan ---------- */
.game { position: relative; height: calc(100dvh - var(--hdr) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; padding: 12px max(14px, env(safe-area-inset-right, 0px)) 12px max(14px, env(safe-area-inset-left, 0px)); }
.game.layout-wide { grid-template-columns: clamp(168px, 19vw, 290px) minmax(0, 1fr) clamp(168px, 19vw, 290px); }
.seat-col { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 0; min-width: 0; }
.seat { min-width: 0; min-height: 0; display: flex; flex-direction: column; container-type: inline-size; }
.seat-col .seat:last-child { justify-content: flex-end; }
.board-col { position: relative; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
.board-vp { position: relative; flex: 1; min-height: 0; min-width: 0; }
.board-vp.cam { overflow: hidden; overflow: clip; border-radius: 26px; background: var(--board); box-shadow: inset 0 0 0 3px var(--frame); touch-action: none; }
.strip { display: none; }
.hud { display: none; }
.game:not(.layout-wide) .seat-col { display: none; }
.game:not(.layout-wide) { grid-template-columns: minmax(0, 1fr); }
.game:not(.layout-wide) .strip { display: grid; gap: 10px; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.game.layout-compact { padding: 8px max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px)); gap: 8px; }
.game.layout-compact .board-col { display: block; }
.game.layout-compact .board-vp { position: absolute; inset: 0; border-radius: 26px; }
.game.layout-compact .strip { position: absolute; left: 6px; right: 6px; top: 6px; z-index: 26; }
.game.layout-compact .hud { position: absolute; left: 0; right: 0; bottom: 0; z-index: 26; }
.game.layout-compact .peek { bottom: calc(var(--hudH, 0px) + 4px); }
.game.layout-compact .strip, .game.layout-land .strip { gap: 6px; }
.game.layout-compact .hud, .game.layout-land .hud { display: block; flex: none; }
.game.layout-land { padding: 6px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); }
.game.layout-land .board-col { display: grid; grid-template-columns: 132px minmax(0, 1fr) minmax(250px, 34%); gap: 8px; }
.game.layout-land .strip { grid-auto-flow: row; grid-auto-rows: min-content; align-content: start; overflow: auto; }
.game.layout-land .hud { min-height: 0; overflow: auto; }

/* kartu pemain */
.pcard { --c: var(--brand); position: relative; display: grid; gap: 9px; width: 100%; padding: 16px 14px 14px; border: 0; border-radius: 22px; background: var(--surface); text-align: left; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line), 0 5px 0 var(--line-2), var(--shadow); transition: transform .25s, box-shadow .25s; overflow: hidden; }
.pcard::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: var(--c); }
.pcard.active { box-shadow: inset 0 0 0 3px var(--c), 0 5px 0 color-mix(in srgb, var(--c) 75%, #000), 0 0 0 6px color-mix(in srgb, var(--c) 22%, transparent), var(--shadow); transform: translateY(-2px); }
.pcard.bankrupt { opacity: .5; filter: grayscale(.8); }
.turn-pill { position: absolute; top: 14px; right: 12px; padding: 3px 10px; border-radius: 99px; background: var(--c); color: #fff; font: 600 12px var(--fd); animation: pillBob 1.4s ease-in-out infinite; }
@keyframes pillBob { 50% { transform: translateY(-3px); } }

.pc-meta span { display: inline-flex; align-items: center; gap: 4px; }

.pc-love { display: flex; align-items: center; gap: 8px; font: 600 12.5px var(--fd); color: var(--brand-ink); }
.pc-love > .ic { color: var(--brand); width: 17px; height: 17px; fill: var(--brand); }
.pc-love .meter { height: 8px; }
.pc-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.pcard.mini { display: flex; align-items: center; gap: 8px; padding: 7px 10px 9px 7px; border-radius: 18px; }
.pcard.mini::before { inset: auto 0 0; height: 4px; }
.pcard.mini .pc-txt { display: grid; min-width: 0; }
.pcard.mini .pc-name { font-size: 14px; }
.pcard.mini .pc-cash { font-size: 16px; gap: 4px; }
.pcard.mini .pc-cash .coin-ic { width: 14px; height: 14px; }
.pcard.mini .pc-flag { margin-left: auto; color: var(--sky-d); }
.pcard.mini.active { transform: none; }
.strip[data-n="4"] .pcard.mini .pc-name, .strip[data-n="3"] .pcard.mini .pc-name { display: none; }
.strip[data-n="4"] .pcard.mini, .strip[data-n="3"] .pcard.mini { justify-content: center; padding-right: 8px; }
.game.layout-compact .strip[data-n="4"] .pcard.mini, .game.layout-compact .strip[data-n="3"] .pcard.mini { flex-direction: column; gap: 3px; padding: 6px 4px 9px; }
.game.layout-compact .strip[data-n="4"] .pcard.mini .av.sm, .game.layout-compact .strip[data-n="3"] .pcard.mini .av.sm { --s: 30px; }
.game.layout-compact .strip[data-n="4"] .pcard.mini .pc-txt, .game.layout-compact .strip[data-n="3"] .pcard.mini .pc-txt { justify-items: center; }

.info-card, .log-card { display: grid; gap: 10px; padding: 14px; border-radius: 22px; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--line); }

.log .bub { width: 24px; height: 24px; flex: none; display: grid; place-items: center; border-radius: 9px; background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--c); }
.log .bub .ic { width: 14px; height: 14px; }

@container (max-width: 236px) {
  .pcard { padding: 14px 12px 12px; gap: 7px; border-radius: 20px; }
  .pc-top { padding-right: 0; gap: 8px; }

}

/* ---------- papan ---------- */
.board { position: absolute; container-type: inline-size; display: grid; grid-template-columns: 1.5fr repeat(7, 1fr) 1.5fr; grid-template-rows: 1.5fr repeat(7, 1fr) 1.5fr; gap: .55cqi; padding: 1.1cqi; border-radius: 3.6cqi; background: radial-gradient(circle at 50% 50%, var(--board) 0 60%, var(--board-2)); box-shadow: inset 0 0 0 .6cqi var(--frame), 0 1.1cqi 0 var(--frame-d), var(--shadow-lg); transform-origin: 0 0; }
.board-vp.cam .board { box-shadow: inset 0 0 0 .6cqi var(--frame); will-change: transform; }
@property --tilt { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
/* ---------- kamera 3D (POV ala Get Rich) ----------
   papan dimiringkan (rotateX) dengan perspektif; pion, bangunan, lencana pemilik & efek dibuat berdiri
   (diputar balik sebesar kemiringan) supaya tampak tegak seperti bidak di meja */
.board-vp.cam3d { background: transparent; box-shadow: none; border-radius: 0; }
.board-vp.cam3d .board { box-shadow: inset 0 0 0 .6cqi var(--frame), 0 1.4cqi 0 var(--frame-d), 0 3cqi 5cqi color-mix(in srgb, var(--frame-d) 55%, transparent); }
.board.b3d, .board.b3d .tokens, .board.b3d .token, .board.b3d .tile { transform-style: preserve-3d; }
.board.b3d .token .tk { rotate: x calc(var(--tilt, 0deg) * -1); }
/* 3D: kotak pion dipanjangkan ke atas supaya ikon pesawat (World Tour) tetap di dalam kotak elemen 3D
   (bagian yang menjulur keluar bisa terpotong kompositor); kaki pion tetap di tempat */
.board.b3d .token .tk { top: calc(var(--ts) * -1.5); height: calc(var(--ts) * 1.58); }
.board.b3d .token .tk-pin { top: calc(var(--ts) * .38); }
.board.b3d .token .tk-av { top: calc(var(--ts) * .88); }
.board.b3d .token .tk-plane { top: 0; }
.board.b3d .t-bld, .board.b3d .t-own, .board.b3d .t-fb { rotate: x calc(var(--tilt, 0deg) * -1); transform-origin: 50% 100%; }
.board.b3d .bfloat, .board.b3d .flag-drop, .board.b3d .stamp-drop, .board.b3d .storm-cloud { rotate: x calc(var(--tilt, 0deg) * -1); }
.board.b3d .tile:hover .t-face { transform: none; }
.board.b3d .center { overflow: visible; transform-style: preserve-3d; }
.board.b3d .center-deco { transform-style: preserve-3d; }
/* maskot: alas & bayangan rebah di bidang papan, Merpi berdiri tegak (diputar balik sebesar kemiringan papan) */
.board.b3d .mascot, .board.b3d .ms-stand, .board.b3d .ms-look { transform-style: preserve-3d; }
.board.b3d .mascot { --mw: 36cqmin; top: 52%; }
.board.b3d .ms-shadow { translate: -50% -50% 2px; }
.board.b3d .ms-stand { rotate: x calc(var(--tilt, 0deg) * -1); translate: 0 0 3px; }
/* tablet tegak saat 3D: panel aksi menjadi dok di bawah papan */
.game.v3d.layout-mid .board-col { position: relative; }
.game.v3d.layout-mid .hud { display: block; position: absolute; left: 50%; bottom: 10px; z-index: 26; width: min(640px, calc(100% - 24px)); translate: -50% 0; }
.game.v3d.layout-mid .hud .ticker { display: flex; }
.game.v3d.layout-mid .hud .st-merpi { position: static; }
.game.v3d.layout-mid .hud .bubble { left: 14px; bottom: calc(100% + 8px); max-width: min(360px, calc(100% - 28px)); }
/* desktop & tablet mendatar saat 3D: panel aksi pindah ke kolom kanan (seperti HP mendatar), papan memakai
   seluruh tinggi layar; kolom kanan sedikit lebih lebar supaya tombol tetap lega */
.game.v3d.layout-wide { grid-template-columns: clamp(168px, 16vw, 260px) minmax(0, 1fr) clamp(236px, 21vw, 310px); }
.game.v3d.layout-wide .seat-col.right { justify-content: flex-start; }
.game.v3d.layout-wide .seat-col.right .hud { display: block; flex: none; position: relative; margin: auto 0; padding: 10px 12px 12px; border-radius: 24px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line-2), var(--shadow); }
.game.v3d.layout-wide .hud .stage { position: relative; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "merpi turn" "dice dice" "acts acts"; gap: 6px 10px; padding: 0; background: none; box-shadow: none; }
.game.v3d.layout-wide .hud .st-merpi { display: contents; }
.game.v3d.layout-wide .hud .merpi-btn { grid-area: merpi; justify-self: center; width: 48px; }
.game.v3d.layout-wide .hud .bubble { grid-area: turn; left: 0; top: 0; bottom: 0; height: max-content; margin: auto 0; max-width: 100%; padding: 6px 11px; font-size: 13px; transform-origin: left center; border-radius: 6px 16px 16px 16px; }
.game.v3d.layout-wide .hud .dice-tray { justify-self: center; justify-content: center; }
.game.v3d.layout-wide .hud .center-actions { flex-direction: column; align-items: stretch; }
.game.v3d.layout-wide .hud .aim { flex: none; }
.game.v3d.layout-wide .hud .btn.go { flex: none; }
.game.v3d.layout-wide .hud .cam-ctl { margin: 0 0 8px; }
.game.v3d.layout-wide .hud .pickbar { border-radius: 24px; }
/* log di bawah panel aksi mengalah: menyusut & bisa digulir, panel aksi tidak pernah terdorong keluar.
   Kartu pemain tidak menyusut; bila tetap tidak muat (layar sangat pendek, 4 pemain) kolom bisa digulir */
.game.v3d.layout-wide .seat-col.right { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }

.board.b3d:not(.far) .tp-card { padding-top: 1.45cqi; }
.board.b3d .tile.s-left .tp-cap, .board.b3d .tile.s-right .tp-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* HP tegak, seluruh papan: kartu, ilustrasi & label dibuat sebesar mungkin dalam petak (tetap tidak saling
   menutupi petak di belakangnya; kemiringan 30°) */
.game.layout-compact .board.b3d.far .tile { --pw: 9.1cqi; }
.game.layout-compact .board.b3d.far .tile.s-left, .game.layout-compact .board.b3d.far .tile.s-right { --pw: 7.4cqi; }
.game.layout-compact .board.b3d.far .tile.corner { --pw: 8cqi; }
.game.layout-compact .board.b3d.far .tp-card { padding: .36cqi; }
.game.layout-compact .board.b3d.far .tp-tag { font-size: 3cqi; }
.game.layout-compact .board.b3d.far .tp-cn { font-size: 2.5cqi; }
/* kolom kiri/kanan saat dekat: kartu lebih ramping supaya ilustrasi petak di belakangnya tidak tertutup */
.board.b3d:not(.far) .tile.s-left, .board.b3d:not(.far) .tile.s-right { --pw: 5.8cqi; }
.board.b3d .tp-tag { position: relative; z-index: 1; margin-bottom: -1.3cqi; }
.board.b3d .tp-tag:not(.toll) { background: var(--tile); color: var(--tile-ink); box-shadow: inset 0 0 0 .26cqi color-mix(in srgb, var(--pc, var(--g)) 75%, var(--tile-edge)), 0 .32cqi 0 color-mix(in srgb, var(--pc, var(--g)) 50%, var(--tile-edge)); }
.board.b3d .tp-tag.toll { box-shadow: inset 0 0 0 .26cqi #fff, 0 .32cqi 0 color-mix(in srgb, var(--oc) 60%, #000); }
.board.b3d .tp-tag.muted { color: var(--ink-2); }
.board.b3d .tp-tag.pop { animation: pop .7s cubic-bezier(.3, 1.8, .5, 1); }
.board.b3d .tp-av { display: grid; place-items: center; width: 1.15em; height: 1.15em; margin: 0 .05em 0 -.4em; border-radius: 50%; background: #fff; font-style: normal; font-size: .92em; line-height: 1; text-shadow: none; }
/* mahkota landmark tersemat di ujung kanan label, menempel ke pojok kartu. Isi kartu berdiri harus tetap di
   dalam kotak .t-pop: bagian yang menjulur keluar dari elemen 3D bisa terpotong kompositor */
.board.b3d .tp-crown { position: absolute; right: -.5em; bottom: -.72em; width: 1.15em; height: 1.15em; rotate: 16deg; }
.board.b3d .tp-crown .ic { width: 100%; height: 100%; fill: #FFD54A; stroke: #A86F00; }
/* label nama sudut: boleh dua baris supaya tetap besar */
.board.b3d .tp-cn { max-width: 12.5cqi; padding: .3cqi 1cqi; border-radius: 1.4cqi; font: 700 1.7cqi/1.05 var(--fd); text-align: center; text-wrap: balance; }
.board.b3d.far .tp-cn { font-size: 2.25cqi; }
.board.b3d .tile.tt-start .tp-cn { color: var(--brand-ink); }
/* pemilik: bingkai kartu berwarna pemilik (avatar & tol ada di label), lencana terpisah tidak dipakai */
.board.b3d .t-own { display: none; }
.board.b3d .tile.owned .tp-card { box-shadow: inset 0 0 0 .34cqi #fff, inset 0 0 0 .66cqi var(--oc), 0 .6cqi 0 color-mix(in srgb, var(--oc) 62%, #000); }
.board.b3d .tile.landmark .tp-card { background: linear-gradient(180deg, #FFE9A6, #FFF6D8 70%); box-shadow: inset 0 0 0 .34cqi #fff, inset 0 0 0 .66cqi #FFC93C, 0 .6cqi 0 #C48A10; }
.board.b3d .tile.fest .tp-card { box-shadow: inset 0 0 0 .34cqi #fff, inset 0 0 0 .66cqi #FFC93C, 0 .6cqi 0 #D08A00, 0 0 0 .5cqi color-mix(in srgb, #FFC93C 45%, transparent); }
/* bangunan & lencana festival berdiri di depan dua sudut bawah kartu: bangunan di sisi luar papan, festival di
   sisi lainnya (baris atas/bawah: bangunan kanan, festival kiri). Selektor .far ditulis ulang supaya menang
   atas aturan papan datar "jauh". Titik level di dalam kotak bangunan */
.board.b3d .t-bld .lv-dots { bottom: 3%; }
.board.b3d .tile .t-bld, .board.b3d.far .tile.s-left .t-bld, .board.b3d.far .tile.s-right .t-bld { --sx: 1; top: auto; right: auto; left: calc(var(--px) + var(--pw) * .42 * var(--sx)); bottom: calc(var(--pb) - 1cqi); width: 4.8cqi; translate: -50% 0; }
.board.b3d .tile.s-left .t-bld, .board.b3d.far .tile.s-left .t-bld { --sx: -1; }
.board.b3d .tile .t-fb { --sx: -1; top: auto; left: calc(var(--px) + var(--pw) * .4 * var(--sx)); bottom: calc(var(--pb) - .8cqi); translate: -50% 0; }
.board.b3d .tile.s-left .t-fb { --sx: 1; }
/* tanda ancaman melayang di sudut kanan atas kartu: diangkat searah "atas" layar (vektor (0, -cos, sin) di
   bidang papan), bukan transform, supaya animasinya tidak bentrok */
.board.b3d .tile.threat::after { --lift: 7.4cqi; right: auto; left: calc(var(--px) + var(--pw) * .5); bottom: var(--pb); translate: -65% calc(var(--lift) * -1 * cos(var(--tilt, 0deg))) calc(var(--lift) * sin(var(--tilt, 0deg))); rotate: x calc(var(--tilt, 0deg) * -1); transform-origin: 50% 100%; }
.board.b3d.far .tile.threat::after { width: 3.6cqi; height: 3.6cqi; font-size: 2.3cqi; }
/* sentuhan & animasi pada kartu (pada papan datar animasinya di muka petak) */
.board.b3d .tile.nope .t-face { animation: none; }
/* langkah pion: lantai petak menyala warna pemain yang berjalan (--walk), mendarat: cincin lebih tebal & lama */
.board.b3d .tile.stepped .t-face { animation: floorStep .55s ease-out; }
.board.b3d .tile.flash .t-face { --walk: #FFC93C; animation: floorLand 1.1s ease-out; }
.board.b3d .tile.landed .t-face { animation: floorLand 1.3s ease-out; }
@keyframes floorStep { 0%, 30% { background: color-mix(in srgb, var(--walk, var(--brand)) 42%, var(--tile)); box-shadow: 0 .5cqi 0 var(--tile-edge), inset 0 0 0 .6cqi var(--walk, var(--brand)); } }
@keyframes floorLand { 0%, 45% { background: color-mix(in srgb, var(--walk, var(--brand)) 46%, var(--tile)); box-shadow: 0 .5cqi 0 var(--tile-edge), inset 0 0 0 .8cqi var(--walk, var(--brand)), 0 0 0 .9cqi color-mix(in srgb, var(--walk, var(--brand)) 40%, transparent); } }
/* efek datar (riak mendarat, debu, percikan, bayangan pion) sedikit di atas lantai supaya selalu tergambar
   di atas muka petak (bidang yang sama bisa saling menutupi), garis riak ikut skala papan */
.board.b3d .ripple, .board.b3d .dust, .board.b3d .spark { translate: 0 0 3px; }
.board.b3d .ripple { border-width: .75cqi; }
.board.b3d .token .tk-shadow { translate: 0 0 1px; }
.board.b3d .tile.stepped .t-pop { animation: popStep .5s ease; }
@keyframes popStep { 35% { transform: translateY(.5cqi) scale(1.05, .9); } 70% { transform: translateY(-.5cqi) scale(.98, 1.03); } }
.board.b3d .tile.flash .t-pop { animation: popFlash 1.1s ease; }
@keyframes popFlash { 30% { transform: translateY(-1.2cqi) scale(1.1); filter: brightness(1.15) saturate(1.2); } }
.board.b3d .tile.nope .t-pop { animation: nope .4s; }
@media (hover: hover) and (pointer: fine) { .board.b3d .tile:hover .t-pop { transform: translateY(-.7cqi); } }
/* papan muncul: kartu terlipat rebah lalu berdiri seperti buku pop-up */
.board.b3d.enter .t-pop { animation: popUp .6s cubic-bezier(.3, 1.45, .5, 1) backwards; animation-delay: calc(var(--d) + 200ms); }
@keyframes popUp { from { rotate: x 0deg; opacity: 0; } 30% { opacity: 1; } }
/* memilih petak (tukar/serang/dll.) */
.board.b3d.picking .tile:not(.pickable) .t-pop { opacity: .38; filter: grayscale(.8); }
.board.b3d.picking .tile.pickable .t-face { animation: none; }
.board.b3d.picking .tile.pickable .t-pop { animation: popPick 1.3s ease-in-out infinite; }
@keyframes popPick { 50% { transform: translateY(-.9cqi); } }
.board.b3d.picking .tile.pickable .tp-card { box-shadow: inset 0 0 0 .34cqi #fff, inset 0 0 0 .7cqi var(--violet), 0 .6cqi 0 var(--violet-d), 0 0 0 .6cqi color-mix(in srgb, var(--violet) 30%, transparent); }
.board.b3d.picking .tile.picked .t-face { transform: none; }
.board.b3d.picking .tile.picked .t-pop { transform: translateY(-1.3cqi) scale(1.06); animation: none; }
.board.b3d.picking .tile.picked .tp-card { box-shadow: inset 0 0 0 .34cqi #fff, inset 0 0 0 .8cqi var(--brand), 0 .6cqi 0 var(--brand-d), 0 0 0 .8cqi color-mix(in srgb, var(--brand) 35%, transparent); }
.board.b3d.picking .tile.picked::before { --lift: 4cqi; top: auto; left: var(--px); bottom: var(--pb); transform: none; translate: -50% calc(var(--lift) * -1 * cos(var(--tilt, 0deg))) calc(var(--lift) * sin(var(--tilt, 0deg))); rotate: x calc(var(--tilt, 0deg) * -1); transform-origin: 50% 100%; z-index: 8; }
/* logo tengah naik sedikit supaya tidak tertutup kartu baris depan */
.board.b3d .cd-logo { bottom: 15cqh; }

/* tengah papan */
.center { grid-area: 2 / 2 / 9 / 9; position: relative; container: ctr / size; border-radius: 2.6cqi; background: radial-gradient(circle at 50% 30%, var(--center), var(--center-2)); box-shadow: inset 0 0 0 .3cqi color-mix(in srgb, var(--frame) 60%, transparent); overflow: hidden; }
.center::before { content: ""; position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(circle, color-mix(in srgb, var(--brand) 18%, transparent) 1.4px, transparent 1.6px); background-size: 22px 22px; pointer-events: none; }
.center-deco { position: absolute; inset: 0; pointer-events: none; }
.cd-map { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
.cd-clouds { fill: var(--cloud); }
.cd-logo { position: absolute; left: 0; right: 0; bottom: 7cqh; text-align: center; font: 700 9cqw/1 var(--fd); color: color-mix(in srgb, var(--brand) 15%, transparent); letter-spacing: -.02em; }
.cd-tag { position: absolute; left: 0; right: 0; bottom: 4cqh; text-align: center; font: 600 2.3cqw/1 var(--fd); letter-spacing: .2em; text-transform: uppercase; color: color-mix(in srgb, var(--ink-3) 60%, transparent); }
.deck { position: absolute; left: 6%; bottom: 16cqh; width: 12cqw; aspect-ratio: .78; rotate: -8deg; }
.deck .dk { position: absolute; inset: 0; border-radius: 1.6cqw; background: linear-gradient(160deg, #FFB3CF, #FF7EAC); box-shadow: inset 0 0 0 .6cqw #fff, 0 .6cqw 0 #D5336E; }
.deck .dk2 { transform: rotate(-7deg) translate(-4%, 2%); }
.deck .dk3 { transform: rotate(8deg) translate(4%, 3%); background: linear-gradient(160deg, #C9B8FF, #9C88FF); box-shadow: inset 0 0 0 .6cqw #fff, 0 .6cqw 0 #5A40D8; }
.deck .dk1 { display: grid; place-items: center; padding: 14%; }
.board.staged .cd-plane, .board.staged .cd-logo, .board.staged .cd-tag { display: none; }
.board.staged .cd-map { opacity: .2; }
.board.staged .deck { left: auto; right: 5.5%; top: 4cqh; bottom: auto; width: 9cqw; rotate: 9deg; }
.deck.pull .dk1 { animation: pull .8s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes pull { 40% { transform: translateY(-30%) rotate(-12deg) scale(1.1); } }
/* kartu teratas diambil (kartu terbang menggantikannya), lalu kartu baru muncul dari tumpukan */
.deck.lift .dk1 { animation: dkTake 1.2s ease both; }
@keyframes dkTake { 0% { opacity: 1; } 12%, 70% { opacity: 0; } 100% { opacity: 1; } }
/* papan 3D: tumpukan kartu sungguhan rebah di atas meja: tiap lapis diangkat, tepi tebal, bayangan di lantai;
   kartu teratas mengambang pelan. Semua lapis seukuran kotak .deck (tidak menjulur keluar elemen 3D) */
.board.b3d .deck { transform-style: preserve-3d; }
.board.b3d .deck::before { content: ""; position: absolute; inset: 4% -4% -6% 4%; border-radius: 2cqw; background: color-mix(in srgb, #2A1838 22%, transparent); filter: blur(.6cqw); }
.board.b3d .deck .dk { box-shadow: inset 0 0 0 .6cqw #fff, 0 0 0 .2cqw #D5336E; }
.board.b3d .deck .dk3 { translate: 0 0 .5cqw; box-shadow: inset 0 0 0 .6cqw #fff, 0 0 0 .2cqw #5A40D8; }
.board.b3d .deck .dk2 { translate: 0 0 1.1cqw; }
.board.b3d .deck .dk1 { translate: 0 0 1.8cqw; animation: dkFloat 3.2s ease-in-out infinite; }
.board.b3d .deck .dk1::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .45) 50%, transparent 65%) 200% 0 / 250% 100% no-repeat; animation: dkShine 4.5s ease-in-out infinite; }
@keyframes dkFloat { 50% { translate: 0 0 2.6cqw; } }
@keyframes dkShine { 0%, 55% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
.board.b3d .deck.pull .dk1 { animation: pull .8s cubic-bezier(.3, 1.4, .5, 1); }
.board.b3d .deck.lift .dk1 { animation: dkTake 1.2s ease both, dkRise 1.2s ease both; }
@keyframes dkRise { 0% { translate: 0 0 1.8cqw; } 12% { translate: 0 0 5cqw; } 70% { translate: 0 0 0; } 100% { translate: 0 0 1.8cqw; } }
/* salinan kartu yang terbang dari papan ke dialog (posisi & ukuran dianimasikan dari JS) */
.fly-card { position: fixed; z-index: 400; display: grid; place-items: center; border-radius: 22px; background: linear-gradient(160deg, #FFB3CF, #FF7EAC); box-shadow: inset 0 0 0 5px #fff, 0 6px 0 #D5336E, 0 18px 30px -10px rgba(90, 20, 60, .45); pointer-events: none; will-change: left, top, width, height, transform; }
.fly-card span { display: block; width: min(60%, 96px); aspect-ratio: 1; }

/* ---------- Merpi besar di tengah papan ----------
   .ms-stand memuat Merpi + ruang di atas kepala (lompat/terbang & emote) supaya isi tidak menjulur keluar kotak 3D */
.ms-mat { position: absolute; inset: 0; border-radius: 50%; }
.ms-mat svg { display: block; width: 100%; height: 100%; }
.ms-shadow { position: absolute; left: 50%; top: 50%; width: 46%; height: 16%; translate: -50% -50%; border-radius: 50%; background: radial-gradient(closest-side, rgba(42, 24, 56, .42), rgba(42, 24, 56, 0)); }
.ms-stand { position: absolute; left: 4%; right: 4%; bottom: calc(50% - var(--mw) * .065); height: 132%; transform-origin: 50% 100%; }
.ms-look { position: absolute; left: 0; right: 0; bottom: 0; aspect-ratio: 1; transform: rotateY(calc(var(--lx, 0) * 24deg)); transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
.ms-body { width: 100%; height: 100%; pointer-events: auto; cursor: pointer; transform-origin: 50% 92%; -webkit-tap-highlight-color: transparent; }
.ms-body .merpi .mp-shadow { display: none; }
.ms-body .merpi .mp-eyes, .ms-body .merpi .mp-blink, .ms-body .merpi .mp-beak { transform: translate(calc(var(--lx, 0) * 5px), calc(var(--ly, 0) * 3px)); transition: transform .4s ease; }
.ms-emote { position: absolute; left: 66%; top: 2%; display: grid; place-items: center; width: 30%; aspect-ratio: 1; border-radius: 50% 50% 50% 12%; background: var(--surface); color: var(--brand); box-shadow: inset 0 0 0 .5cqmin var(--line), 0 .7cqmin 0 var(--line); opacity: 0; transform: scale(.3) translateY(30%); transform-origin: 10% 100%; transition: opacity .2s, transform .35s cubic-bezier(.3, 1.6, .5, 1); }
.ms-emote.show { opacity: 1; transform: none; }
.ms-emote .ic { width: 58%; height: 58%; }
.ms-zz { font: 700 4.4cqmin/1 var(--fd); color: var(--violet); letter-spacing: .02em; }
.ms-zz i, .ms-zz b { font-style: normal; display: inline-block; }
.ms-zz i { translate: 0 -20%; font-size: .85em; }
.ms-zz b { translate: 0 -45%; font-size: 1.2em; }
.mascot.sleep .ms-emote { animation: zzFloat 2.4s ease-in-out infinite; }
@keyframes zzFloat { 50% { transform: translateY(-8%); } }
#mascot .merpi.is-sleep .mp-eyes-open { display: none; }
#mascot .merpi.is-sleep .mp-blink { display: inline; opacity: 1; animation: none; }
#mascot .merpi.is-sleep .mp-bob { animation: mpSleep 3.6s ease-in-out infinite; }
#mascot .merpi.is-sleep .mp-wing-l, #mascot .merpi.is-sleep .mp-wing-r { animation: none; }
@keyframes mpSleep { 50% { transform: translateY(2px) rotate(-4deg) scaleY(.97); } }
.mascot.act-hop .ms-body { animation: msHop .7s cubic-bezier(.3, 1.5, .5, 1); }
.mascot.act-peek .ms-body { animation: msPeek .7s ease; }
.mascot.act-cheer .ms-body { animation: msCheer .8s ease; }
.mascot.act-droop .ms-body { animation: msDroop 1s ease; }
.mascot.act-shake .ms-body { animation: msShake .7s ease; }
.mascot.act-spin .ms-body { animation: msSpin .9s cubic-bezier(.4, 0, .3, 1); }
.mascot.act-fly .ms-body { animation: msFly 1.5s ease-in-out; }
.mascot.act-fly .merpi .mp-wing-l { animation: flapL .18s ease-in-out infinite; }
.mascot.act-fly .merpi .mp-wing-r { animation: flapR .18s ease-in-out infinite; }
.mascot.act-hop .ms-shadow, .mascot.act-cheer .ms-shadow { animation: msShHop .7s cubic-bezier(.3, 1.5, .5, 1); }
.mascot.act-spin .ms-shadow { animation: msShHop .9s ease; }
.mascot.act-fly .ms-shadow { animation: msShFly 1.5s ease-in-out; }
@keyframes msHop { 35% { transform: translateY(-14%) scale(.96, 1.06); } 70% { transform: translateY(1%) scale(1.06, .94); } }
@keyframes msPeek { 40% { transform: translateY(-4%) rotate(calc(var(--lx, 0) * 8deg)); } }
@keyframes msCheer { 25% { transform: translateY(-10%) rotate(-9deg); } 55% { transform: translateY(-6%) rotate(9deg); } 80% { transform: translateY(0) scale(1.05, .95); } }
@keyframes msDroop { 40%, 70% { transform: translateY(3%) rotate(-6deg) scaleY(.92); } }
@keyframes msShake { 20%, 60% { transform: translateX(-6%) rotate(-5deg); } 40%, 80% { transform: translateX(6%) rotate(5deg); } }
@keyframes msSpin { 0% { transform: none; } 40% { transform: translateY(-14%) rotateY(200deg); } 80% { transform: translateY(0) rotateY(360deg); } 90% { transform: scale(1.05, .95) rotateY(360deg); } 100% { transform: rotateY(360deg); } }
@keyframes msFly { 0%, 100% { transform: none; } 25% { transform: translateY(-22%) rotate(-6deg); } 50% { transform: translateY(-20%) translateX(-5%) rotate(5deg); } 75% { transform: translateY(-22%) translateX(5%) rotate(-4deg); } }
@keyframes msShHop { 35% { transform: scale(.68); opacity: .55; } }
@keyframes msShFly { 25%, 75% { transform: scale(.5); opacity: .4; } }

/* panggung: Merpi, dadu, aksi */
.stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 1.6cqh; padding: 3.6cqh 7% 3cqh; z-index: 2; }
.st-top { display: flex; justify-content: center; }
.round-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; background: var(--surface); color: var(--ink-2); font: 600 clamp(12px, 3.1cqw, 15px) var(--fd); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--line); }
.round-chip b { color: var(--brand-ink); }
.round-chip .ic { color: var(--brand); }
.st-merpi { --mw: clamp(60px, 19cqh, 116px); position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 19cqh; }
.merpi-btn { border: 0; background: none; padding: 0; width: var(--mw); aspect-ratio: 1; flex: none; border-radius: 50%; }
/* di tengah papan gelembung melayang di kanan Merpi, jadi Merpi tetap di tengah */
.center .bubble { position: absolute; z-index: 3; left: calc(50% + var(--mw) / 2 + 4px); top: 0; width: max-content; max-width: min(250px, calc(50% - var(--mw) / 2 - 14px)); transform-origin: left center; }
.merpi-btn:focus-visible { outline-offset: -4px; }
.merpi { display: block; width: 100%; height: 100%; overflow: visible; }
.merpi .mp-eyes { display: none; }
.merpi .mp-eyes-open { display: inline; }
.merpi .mp-blink, .merpi .mp-sweat { display: none; }
.merpi.is-happy .mp-eyes-open, .merpi.is-sad .mp-eyes-open, .merpi.is-wow .mp-eyes-open, .merpi.is-love .mp-eyes-open, .merpi.is-think .mp-eyes-open { display: none; }
.merpi.is-happy .mp-eyes-happy, .merpi.is-sad .mp-eyes-sad, .merpi.is-wow .mp-eyes-wow, .merpi.is-love .mp-eyes-love, .merpi.is-think .mp-eyes-think, .merpi.is-sad .mp-sweat { display: inline; }
.merpi .mp-bob { animation: mpBob 2.6s ease-in-out infinite; transform-origin: 60px 104px; }
.merpi .mp-wing-l { transform-origin: 30px 74px; animation: wingL 2.6s ease-in-out infinite; }
.merpi .mp-wing-r { transform-origin: 90px 74px; animation: wingR 2.6s ease-in-out infinite; }
.merpi:not(.is-happy):not(.is-sad):not(.is-wow):not(.is-love):not(.is-think) .mp-blink { display: inline; animation: blink 4.6s infinite; opacity: 0; }
.merpi:not(.is-happy):not(.is-sad):not(.is-wow):not(.is-love):not(.is-think) .mp-eyes-open { animation: eyesHide 4.6s infinite; }
@keyframes blink { 0%, 93%, 100% { opacity: 0; } 95%, 97% { opacity: 1; } }
@keyframes eyesHide { 0%, 93%, 100% { opacity: 1; } 95%, 97% { opacity: 0; } }
@keyframes mpBob { 50% { transform: translateY(-3px) scaleY(1.02); } }
@keyframes wingL { 50% { transform: rotate(-10deg); } }
@keyframes wingR { 50% { transform: rotate(10deg); } }
.merpi.is-happy .mp-wing-l, .merpi.is-love .mp-wing-l, .merpi.is-wow .mp-wing-l { animation: flapL .35s ease-in-out infinite; }
.merpi.is-happy .mp-wing-r, .merpi.is-love .mp-wing-r, .merpi.is-wow .mp-wing-r { animation: flapR .35s ease-in-out infinite; }
@keyframes flapL { 50% { transform: rotate(-32deg); } }
@keyframes flapR { 50% { transform: rotate(32deg); } }
.merpi.is-think .mp-bob { animation: think 1.6s ease-in-out infinite; }
@keyframes think { 50% { transform: rotate(-6deg); } }
.merpi-btn.jump { animation: jump .7s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes jump { 35% { transform: translateY(-18%) scale(1.06); } 70% { transform: translateY(2%) scale(.97, 1.04); } }
.merpi-btn.droop { animation: droop .9s ease; }
@keyframes droop { 40% { transform: translateY(6%) rotate(-6deg) scaleY(.94); } }
.bubble { position: relative; max-width: 58%; padding: 9px 14px; border-radius: 18px 18px 18px 6px; background: var(--surface); color: var(--ink); font: 600 clamp(12.5px, 3.3cqw, 15.5px)/1.3 var(--fd); box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line); opacity: 0; transform: scale(.6) translateX(-12px); transform-origin: left bottom; transition: opacity .2s, transform .3s cubic-bezier(.3, 1.6, .5, 1); pointer-events: none; }
.bubble.show { opacity: 1; transform: none; }
.st-main { display: grid; justify-items: center; align-content: start; gap: 1.5cqh; width: 100%; }
.center .st-merpi { margin-top: auto; }
.center .st-main { margin-bottom: auto; }
.center .dice-tray { margin: .3cqh 0 1.1cqh; }
.turn-line { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px 5px 6px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); font: 600 clamp(13px, 3.4cqw, 16px)/1.2 var(--fd); color: var(--ink-2); max-width: 100%; }
.turn-line b { color: var(--ink); }
.turn-line .tl-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-round { display: none; align-items: center; gap: 4px; padding-left: 8px; margin-left: 2px; border-left: 2px solid var(--line); color: var(--ink-3); font-size: .86em; white-space: nowrap; }
.tl-round .ic { width: 14px; height: 14px; color: var(--brand); }
.turn-line.pop { animation: pop .8s cubic-bezier(.3, 1.6, .5, 1); }
.status-note { min-height: 1.3em; font: 600 clamp(12px, 3cqw, 14px)/1.35 var(--fb); color: var(--ink-2); text-align: center; max-width: 92%; }
.wait { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.wait .ic { color: var(--violet); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: dot 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-4px); opacity: .4; } }
.center-actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; width: 100%; }
.center-actions:empty { display: none; }
.aim { display: flex; gap: 6px; padding: 5px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); width: min(100%, 340px); }
.aim button { flex: 1; display: grid; gap: 1px; border: 0; padding: 6px 4px; border-radius: 13px; background: transparent; color: var(--ink-2); font: 600 14px/1.1 var(--fd); min-height: 46px; transition: background .15s, transform .15s; }
.aim small { font: 700 11.5px/1 var(--fb); color: var(--ink-3); }
.aim button[aria-pressed="true"] { background: var(--violet-soft); color: var(--violet-d); box-shadow: inset 0 0 0 2px var(--violet); transform: translateY(-1px); }
:root[data-theme="dark"] .aim button[aria-pressed="true"] { color: #fff; }
.isle-opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }
.isle-opts .btn { min-height: 40px; font-size: 14px; padding: 0 12px; }
.ticker { position: relative; margin-top: 0; width: 100%; flex: none; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 12px; border-radius: 14px; background: color-mix(in srgb, var(--surface) 82%, transparent); color: var(--ink-2); font: 600 clamp(11.5px, 2.8cqw, 13.5px)/1.3 var(--fb); box-shadow: inset 0 0 0 1.5px var(--line); }
.ticker span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticker .ic { color: var(--brand); flex: none; }
.ticker.new { animation: tickIn .5s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes tickIn { from { transform: translateY(8px); opacity: 0; } }


/* dadu 3D */
.dice-tray { position: relative; display: flex; gap: clamp(12px, 4cqw, 22px); padding: 4px 0; }
.die-slot { --s: clamp(44px, 12cqh, 68px); width: var(--s); height: var(--s); perspective: 600px; filter: drop-shadow(0 4px 6px rgba(120, 40, 90, .14)); }
.die { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .95s cubic-bezier(.2, .85, .3, 1); }
.die .face { position: absolute; inset: 0; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 15%; border-radius: 22%; background: radial-gradient(circle at 30% 25%, #FFFFFF, #FFF0F5); box-shadow: inset 0 0 0 2px #F3C4D6, inset 0 -5px 0 #F7D6E3; backface-visibility: hidden; }
.die .face i { width: 72%; aspect-ratio: 1; margin: auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6E5A84, #3A2B4A); }
.die .f1 { transform: translateZ(calc(var(--s) / 2)); }
.die .f1 .hrt { grid-area: 1 / 1 / 4 / 4; width: 70%; height: 70%; margin: auto; display: grid; place-items: center; background: none; }
.die .f1 .hrt svg { width: 100%; height: 100%; fill: #FF4F8B; }
.die .f6 { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.die .f3 { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.die .f4 { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.die .f5 { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.die .f2 { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
.dice-tray.rolling .die-slot { animation: toss var(--roll, 950ms) cubic-bezier(.3, .7, .3, 1); }
.dice-tray.rolling .die-slot:nth-child(2) { animation-delay: 50ms; }
@keyframes toss { 30% { transform: translateY(-26px) rotate(-10deg); } 65% { transform: translateY(4px) rotate(4deg); } 80% { transform: translateY(-6px); } }
/* hasil lemparan: kanan = jumlah (+ KEMBAR), kiri = hasil bidikan. Keduanya diapit di sisi dadu,
   tidak pernah di atas/bawah, jadi tidak menimpa giliran, catatan, atau tombol */
.roll-l, .roll-r { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.roll-r { left: calc(100% + 12px); align-items: flex-start; }
.roll-l { right: calc(100% + 12px); align-items: flex-end; }
.sum-badge, .dbl-badge, .aim-badge { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border-radius: 99px; white-space: nowrap; animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.sum-badge { min-width: 40px; padding: 3px 11px; background: var(--ink); color: var(--surface); font: 700 17px/1.25 var(--fd); box-shadow: 0 3px 0 color-mix(in srgb, var(--ink) 55%, transparent); }
.sum-badge i { font-style: normal; font-weight: 600; opacity: .55; }
.dbl-badge, .aim-badge { padding: 3px 10px; font: 700 12px/1.25 var(--fd); animation-delay: .12s; }
.dbl-badge { background: var(--gold); color: #5A3500; box-shadow: 0 2px 0 var(--gold-d); }
.aim-badge { background: var(--surface-3); color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--line-2); }
.aim-badge .ic { width: 14px; height: 14px; flex: none; }
.aim-badge.hit { background: var(--violet-d); color: #fff; box-shadow: 0 2px 0 color-mix(in srgb, var(--violet-d) 60%, #000); }
.dice-tray.dbl .die-slot { filter: drop-shadow(0 0 7px color-mix(in srgb, var(--gold) 75%, transparent)) drop-shadow(0 4px 6px rgba(120, 40, 90, .14)); }

@container ctr (max-height: 500px) {
  .stage { gap: 1.3cqh; padding: 3cqh 5% 3cqh; }
  .st-top, .ticker, .deck { display: none; }
  .tl-round { display: inline-flex; }
  .st-merpi { min-height: 0; --mw: clamp(52px, 15cqh, 84px); }
  .st-main { gap: 1.2cqh; }
  .dice-tray { padding: 2px 0; }
  .stage.aiming .status-note { display: none; }
  .die-slot { --s: clamp(40px, 11cqh, 58px); }
  .aim button { min-height: 40px; padding: 4px; }
  .center-actions { gap: 8px; }
  .center-actions .btn.go { min-height: 50px; font-size: 19px; padding: 0 22px; }
  .center-actions .btn.big { min-height: 48px; }
}
@container ctr (max-height: 380px) {
  .st-merpi { --mw: max(46px, 13cqh); }
  .bubble { font-size: 12.5px; padding: 7px 11px; }
  .isle-opts .btn { min-height: 36px; font-size: 13px; }
}

/* ---------- pion ---------- */
.tokens { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.token { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 1; }
.token .tk { position: absolute; left: calc(var(--ts) * -.5); top: calc(var(--ts) * -1.12); width: var(--ts); height: calc(var(--ts) * 1.2); transform-origin: 50% 100%; }
.tk-pin { position: absolute; left: 0; top: 0; width: var(--ts); height: var(--ts); border-radius: 50% 50% 50% 0; transform: rotate(-45deg) scale(.86); background: var(--c); box-shadow: inset 0 0 0 calc(var(--ts) * .07) rgba(255, 255, 255, .5), inset calc(var(--ts) * -.1) calc(var(--ts) * -.1) 0 rgba(0, 0, 0, .14); }
.tk-av { position: absolute; left: 50%; top: calc(var(--ts) * .5); width: calc(var(--ts) * .72); height: calc(var(--ts) * .72); transform: translate(-50%, -50%); display: grid; place-items: center; border-radius: 50%; background: #fff; font-size: calc(var(--ts) * .46); line-height: 1; }
.tk-plane { position: absolute; left: 50%; top: calc(var(--ts) * -.38); transform: translateX(-50%) scale(0); width: calc(var(--ts) * .8); height: calc(var(--ts) * .8); display: grid; place-items: center; border-radius: 50%; background: var(--violet); color: #fff; transition: transform .25s; }
.tk-plane .ic { width: 70%; height: 70%; }
.tk-shadow { position: absolute; left: calc(var(--ts) * -.32); top: calc(var(--ts) * -.08); width: calc(var(--ts) * .64); height: calc(var(--ts) * .2); border-radius: 50%; background: rgba(40, 10, 40, .28); }
.token.me .tk-shadow { box-shadow: 0 0 0 calc(var(--ts) * .1) color-mix(in srgb, var(--c) 45%, transparent); animation: meRing 1.4s ease-in-out infinite; }
@keyframes meRing { 50% { box-shadow: 0 0 0 calc(var(--ts) * .22) color-mix(in srgb, var(--c) 20%, transparent); } }
.token.me .tk { animation: idleBob 1.6s ease-in-out infinite; }
@keyframes idleBob { 50% { transform: translateY(-8%); } }
.token.out { opacity: 0; transition: opacity .6s; }
.token.island .tk { animation: islandBob 2s ease-in-out infinite; }
@keyframes islandBob { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-4%); } }
.token.hop .tk { animation: hop var(--hop, 165ms) cubic-bezier(.3, .6, .4, 1); }
@keyframes hop { 0% { transform: scale(1.12, .86); } 45% { transform: translateY(-48%) scale(.94, 1.08); } 85% { transform: translateY(0) scale(1.1, .9); } 100% { transform: none; } }
.token.land .tk { animation: landB .56s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes landB { 20% { transform: scale(1.25, .78); } 55% { transform: scale(.92, 1.1) translateY(-10%); } }
.token.fly .tk { animation: flyArc var(--fly, 640ms) cubic-bezier(.45, 0, .25, 1); }
@keyframes flyArc { 50% { transform: translateY(-90%) scale(1.3); } }
.token.plane .tk { animation: planeArc var(--fly, 1300ms) cubic-bezier(.45, 0, .25, 1); }
.token.plane .tk-plane { transform: translateX(-50%) scale(1); }
@keyframes planeArc { 15% { transform: translateY(-60%) scale(1.25) rotate(-8deg); } 50% { transform: translateY(-150%) scale(1.45) rotate(6deg); } 85% { transform: translateY(-50%) scale(1.2); } }
.token.cheer .tk { animation: cheer .8s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes cheer { 30% { transform: translateY(-40%) rotate(-10deg); } 60% { transform: translateY(-10%) rotate(8deg); } }
.token.shake .tk { animation: shakeT .6s; }
@keyframes shakeT { 20%, 60% { transform: translateX(-12%) rotate(-8deg); } 40%, 80% { transform: translateX(12%) rotate(8deg); } }

/* efek papan */
.ripple { position: absolute; width: var(--r); height: var(--r); margin: calc(var(--r) / -2) 0 0 calc(var(--r) / -2); border-radius: 50%; border: 4px solid var(--c); animation: ripple .9s ease-out forwards; }
@keyframes ripple { from { transform: scale(.2); opacity: .9; } to { transform: scale(1); opacity: 0; } }
.flag-drop { position: absolute; width: var(--sz); height: var(--sz); margin: calc(var(--sz) * -.9) 0 0 calc(var(--sz) * -.35); animation: flagDrop 1.4s cubic-bezier(.3, 1.4, .5, 1) forwards; }
@keyframes flagDrop { 0% { transform: translateY(-120%) scale(.7); opacity: 0; } 30% { transform: translateY(0) scale(1.1); opacity: 1; } 45% { transform: scale(.95, 1.05); } 80% { opacity: 1; } 100% { transform: translateY(-14%); opacity: 0; } }
.stamp-drop { position: absolute; width: var(--sz); margin-left: calc(var(--sz) * -.5); margin-top: calc(var(--sz) * -.25); padding: 6px 4px; border-radius: 12px; border: 4px solid var(--c); color: var(--c); background: color-mix(in srgb, #fff 82%, var(--c)); font: 700 calc(var(--sz) * .15)/1.1 var(--fd); text-align: center; letter-spacing: .04em; transform: rotate(-12deg); animation: stamp 1.5s cubic-bezier(.3, 1.6, .5, 1) forwards; }
@keyframes stamp { 0% { transform: rotate(-12deg) scale(2.6); opacity: 0; } 22% { transform: rotate(-12deg) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: rotate(-12deg) scale(1); opacity: 0; } }
.spark { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 3px; background: var(--c); animation: spark .9s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes spark { from { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.3); opacity: 0; } }
.dust { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: rgba(240, 225, 235, .95); box-shadow: 0 0 0 2px rgba(200, 170, 190, .5); animation: dust .9s ease-out forwards; }
@keyframes dust { from { transform: translate(0, 0) scale(var(--s)); opacity: .95; } to { transform: translate(var(--dx), -18px) scale(calc(var(--s) * 1.7)); opacity: 0; } }
.storm-cloud { position: absolute; width: var(--sz); height: var(--sz); margin: calc(var(--sz) * -.5) 0 0 calc(var(--sz) * -.5); color: #5B5F97; animation: storm 1.4s ease forwards; }
.storm-cloud .ic { width: 100%; height: 100%; fill: #D7D9F2; }
@keyframes storm { 0% { transform: translateY(-40%) scale(.5); opacity: 0; } 20% { transform: none; opacity: 1; } 35%, 55% { filter: brightness(1.8); } 45% { filter: none; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20%); } }
.coin { position: absolute; left: -10px; top: -10px; width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF4BF 0 20%, transparent 22%), radial-gradient(circle, #FFD54A 0 56%, #F0B419 57%); box-shadow: inset 0 0 0 2px #C98D06, 0 2px 4px rgba(0, 0, 0, .2); }
.bfloat { position: absolute; transform: translate(-50%, -50%); padding: 3px 10px; border-radius: 99px; font: 700 15px/1.2 var(--fd); white-space: nowrap; animation: bfloat 1.7s cubic-bezier(.2, .8, .3, 1) forwards; display: inline-flex; align-items: center; gap: 3px; }
.bfloat .ic { width: 15px; height: 15px; fill: currentColor; }
.bfloat.plus { background: var(--mint); color: #fff; box-shadow: 0 3px 0 var(--mint-d); }
.bfloat.minus { background: var(--danger); color: #fff; box-shadow: 0 3px 0 var(--danger-d); }
.bfloat.love { background: var(--brand); color: #fff; box-shadow: 0 3px 0 var(--brand-d); }
@keyframes bfloat { 0% { transform: translate(-50%, -20%) scale(.5); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -140%); opacity: 0; } }

/* banner, peek, kamera, pickbar */
.banner { position: absolute; left: 50%; top: 40%; z-index: 30; width: min(92%, 460px); transform: translate(-50%, -50%); pointer-events: none; animation: bnIn .6s cubic-bezier(.3, 1.5, .5, 1); }
.banner.out { animation: bnOut .42s ease forwards; }
.bn-in { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 24px; background: var(--surface); box-shadow: inset 0 0 0 3px var(--brand), 0 6px 0 var(--brand-d), var(--shadow-lg); }
.bn-art { width: 64px; height: 64px; flex: none; --oc: var(--brand); }
.bn-txt { display: grid; gap: 3px; min-width: 0; }
.banner b { font: 700 clamp(22px, 4.2vw, 30px)/1.05 var(--fd); color: var(--brand); letter-spacing: -.01em; }
.banner span { font: 600 14px/1.35 var(--fb); color: var(--ink-2); }
.banner.gold .bn-in { box-shadow: inset 0 0 0 3px var(--gold), 0 6px 0 var(--gold-d), var(--shadow-lg); background: linear-gradient(180deg, var(--surface), var(--gold-soft)); }
.banner.gold b { color: var(--gold-d); }
.banner.party .bn-in { box-shadow: inset 0 0 0 3px var(--gold), 0 6px 0 var(--gold-d), var(--shadow-lg); }
.banner.take .bn-in { box-shadow: inset 0 0 0 3px var(--violet), 0 6px 0 var(--violet-d), var(--shadow-lg); }
.banner.take b { color: var(--violet); }
.banner.warn .bn-in { box-shadow: inset 0 0 0 3px var(--danger), 0 6px 0 var(--danger-d), var(--shadow-lg); }
.banner.warn b { color: var(--danger-d); }
.banner.goal .bn-in { box-shadow: inset 0 0 0 3px var(--mint), 0 6px 0 var(--mint-d), var(--shadow-lg); }
.banner.goal b { color: var(--mint-d); }
@keyframes bnIn { from { transform: translate(-50%, -50%) scale(.4) rotate(-6deg); opacity: 0; } }
@keyframes bnOut { to { transform: translate(-50%, -60%) scale(.9); opacity: 0; } }
.peek { position: absolute; left: 50%; bottom: 14px; z-index: 25; width: min(92%, 400px); transform: translateX(-50%); display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 2.5px #FF9EC4, 0 5px 0 #FF9EC4, var(--shadow); animation: peekIn .5s cubic-bezier(.3, 1.4, .5, 1); }
.peek.out { animation: peekOut .38s ease forwards; }
.pk-art { width: 46px; height: 46px; flex: none; }
.peek small { display: block; font: 700 11.5px var(--fd); color: var(--brand-ink); text-transform: uppercase; letter-spacing: .05em; }
.peek b { display: block; font: 600 16px/1.2 var(--fd); }
.peek span { display: block; font-size: 13px; color: var(--ink-2); line-height: 1.35; }
@keyframes peekIn { from { transform: translate(-50%, 30px); opacity: 0; } }
@keyframes peekOut { to { transform: translate(-50%, 16px); opacity: 0; } }
.cam-ctl { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 20; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.cam-ctl > * { pointer-events: auto; }
.cam-ctl[hidden] { display: none; }
.round-chip.vp { box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--line-2); font-size: 13.5px; }
.cam-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 0; border-radius: 14px; background: var(--surface); color: var(--ink); font: 600 13.5px var(--fd); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--line-2); }
.cam-btn .ic { color: var(--violet); }
.pickbar { position: absolute; left: 50%; bottom: 12px; z-index: 28; width: min(calc(100% - 20px), 560px); transform: translateX(-50%); display: grid; gap: 10px; padding: 12px; border-radius: 22px; background: var(--surface); box-shadow: inset 0 0 0 3px var(--violet), 0 6px 0 var(--violet-d), var(--shadow-lg); animation: peekIn .45s cubic-bezier(.3, 1.4, .5, 1); }
.pb-head { display: flex; align-items: center; gap: 12px; }
.pb-art { width: 48px; height: 48px; flex: none; --oc: var(--brand); }
.pb-txt { display: grid; gap: 2px; min-width: 0; }
.pb-txt b { font: 600 18px/1.15 var(--fd); color: var(--violet-d); }
:root[data-theme="dark"] .pb-txt b { color: var(--violet-2); }
.pb-txt span { font-size: 13.5px; line-height: 1.35; color: var(--ink-2); }
.pb-acts { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.pb-acts .btn { min-height: 44px; }
/* bilah pilih di tengah papan (desktop/tablet) */
.center .pickbar { left: 5%; right: 5%; bottom: 4cqh; width: auto; transform: none; z-index: 5; animation: pbUp .4s cubic-bezier(.3, 1.4, .5, 1); }
.game.pick-on .center .dice-tray, .game.pick-on .center .status-note, .game.pick-on .center .ticker, .game.pick-on .center .deck { display: none; }
/* bilah pilih menggantikan panel HUD (ponsel) */
.game.layout-land .hud { position: relative; }
.hud .pickbar { left: 0; right: 0; bottom: 0; width: auto; min-height: 100%; transform: none; align-content: center; border-radius: 24px; animation: pbUp .35s cubic-bezier(.3, 1.4, .5, 1); }
.game.pick-on .hud .stage, .game.pick-on .hud .cam-ctl { visibility: hidden; }

.ap-shine { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 32%, rgba(255, 248, 222, .75) 48%, transparent 64%); translate: -115% 0; animation: apShine 1.2s .62s ease-in-out forwards; }
.ap-fx { position: absolute; left: calc(14px + var(--bw) / 2); top: calc(50% - 4px); width: 0; height: 0; z-index: 2; pointer-events: none; }
.ap-fx i { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); margin: calc(var(--h) / -2) 0 0 calc(var(--w) / -2); border-radius: var(--br); background: var(--c); opacity: 0; animation: apConf 1.5s cubic-bezier(.2, .6, .35, 1) var(--d) forwards; }

@keyframes apIn { 0% { transform: translateY(-28px) scale(.86); opacity: 0; } 60% { transform: translateY(4px) scale(1.02); opacity: 1; } 100% { transform: none; } }

/* kartu fisik 3D: muka depan (z 0), tepi tebal (lapisan tengah) & punggung (diputar 180°) dalam satu ruang 3D.

   balikan lewat properti rotate/translate supaya keduanya tidak bentrok */
.lc-inner { position: relative; transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .5s cubic-bezier(.2, .8, .3, 1); }
