<title>Loveopoly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Loveopoly: board game keliling dunia untuk pasangan LDR. Beli kota romantis, bangun sampai landmark, adakan festival, dan menangkan monopoli.">
<style>
/*FONTS*/
/*STYLE*/
</style>
<div class="page-sky" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
<header class="hdr">
  <a class="brand" href="#" id="brandHome" aria-label="Loveopoly, ke menu utama"><span class="brand-mark"></span><span class="brand-name">Loveopoly</span></a>
  <div class="hdr-mid" id="hdrMid"></div>
  <div class="hdr-right">
    <button class="icon-btn" id="hGuide" type="button" aria-label="Buku panduan"></button>
    <button class="icon-btn" id="hSound" type="button" aria-pressed="true" aria-label="Efek suara"></button>
    <button class="icon-btn" id="hSettings" type="button" aria-label="Pengaturan"></button>
    <button class="icon-btn accent" id="hMenu" type="button" aria-label="Menu permainan" hidden></button>
  </div>
</header>
<main>
  <section class="screen" id="scrHome" aria-label="Menu utama"><div class="empty big"><div class="spinner"></div>Memuat Loveopoly…</div></section>
  <section class="screen" id="scrSetup" aria-label="Pengaturan pemain" hidden></section>
  <section class="screen" id="scrOnline" aria-label="Main online" hidden></section>
  <section class="screen" id="scrGame" aria-label="Papan permainan" hidden>
    <div class="game" id="game">
      <aside class="seat-col left" aria-label="Pemain"><div class="seat" id="slotTL"></div><div class="seat" id="slotBL"></div></aside>
      <div class="board-col">
        <div class="strip" id="strip" aria-label="Pemain"></div>
        <div class="board-vp" id="boardVP">
          <div class="board" id="board"></div>
          <div class="cam-ctl" id="camCtl" hidden></div>
          <div class="pickbar" id="pickbar" hidden></div>
        </div>
        <div class="hud" id="hud"></div>
      </div>
      <aside class="seat-col right" aria-label="Pemain"><div class="seat" id="slotTR"></div><div class="seat" id="slotBR"></div></aside>
    </div>
  </section>
  <div id="fatal" class="note warn page" hidden></div>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot" hidden></div>
<div id="overlayRoot"></div>
